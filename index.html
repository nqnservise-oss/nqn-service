<style>

*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}

.brand{display:flex;align-items:center;gap:11px;margin:0 5px 26px}.brandmark{font-weight:900;background:var(--blue);border-radius:11px;padding:10px 9px}.brandname{font-size:18px;font-weight:850}.brandsub{font-size:11px;color:#a8b7c9;margin-top:2px}

.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.eyebrow{font-size:10px;color:var(--blue);font-weight:850;letter-spacing:1.4px}.top h1{font-size:30px;margin:3px 0 0}
.hero{background:linear-gradient(135deg,#10243e,#183e6b);color:#fff;border-radius:19px;padding:27px 28px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 28px rgba(16,36,62,.12)}.hero h2{margin:5px 0 8px;font-size:27px}.hero p{margin:0;color:#c8d5e4;max-width:760px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.primary{background:var(--blue);color:white}.btn.primary:hover{background:var(--blue2)}.btn.secondary{background:#edf1f6;color:#2a3b51}.btn.danger{background:#fff0f0;color:#b33e3e}.btn.success{background:var(--greenbg);color:var(--green)}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.stat.soft{background:var(--soft);border-color:#d4e4ff}.stat.warn{background:var(--amberbg);border-color:#f3dfb5}.stat.bad{background:var(--redbg);border-color:#f1cccc}.statlabel{font-size:12px;color:var(--muted);font-weight:700}.statvalue{font-size:28px;font-weight:850;margin:6px 0 2px}.stathelp{font-size:11px;color:#95a1b1}
.alerts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.alert{border-radius:14px;padding:15px 16px;border:1px solid var(--line);background:#fff}.alert strong{display:block;font-size:14px;margin-bottom:4px}.alert span{font-size:12px;color:var(--muted)}.alert.red{background:var(--redbg);border-color:#f1cccc}.alert.amber{background:var(--amberbg);border-color:#f3dfb5}.alert.green{background:var(--greenbg);border-color:#caeadc}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px;margin-top:17px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panelhead h3{font-size:19px;margin:3px 0 0}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#7d8999;padding:10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #eef1f5;font-size:13px}tbody tr.clickable{cursor:pointer}tbody tr.clickable:hover{background:#f8faff}.mono{font-family:Consolas,monospace;font-weight:850;color:var(--blue)}.muted{color:var(--muted);font-size:11px;margin-top:2px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eef4ff;color:#225cac;font-weight:750;font-size:11px}.badge.red{background:var(--redbg);color:var(--red)}.badge.green{background:var(--greenbg);color:var(--green)}.badge.amber{background:var(--amberbg);color:var(--amber)}.empty{text-align:center;padding:34px;color:var(--muted)}
.formlayout{display:grid;grid-template-columns:minmax(0,1fr) 315px;gap:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}.short{max-width:220px}label{font-size:11px;color:#58677b;font-weight:750}input,select,textarea{border:1px solid #d8e0ea;border-radius:10px;background:#fff;padding:10px 11px;color:var(--text);outline:none;width:100%}input:focus,select:focus,textarea:focus{border-color:#8eb8ff;box-shadow:0 0 0 3px rgba(13,91,216,.08)}input[readonly]{background:#f5f7fa;color:#788497}textarea{resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:3px;flex-wrap:wrap}.hint{font-size:11px;color:var(--muted)}
.sidecard{background:var(--navy);color:#fff;border-radius:16px;padding:21px;height:max-content}.sidecard h3{margin:7px 0 8px}.sidecard p{color:#c2cedc;line-height:1.5;font-size:13px}.flow{display:flex;flex-direction:column;gap:6px;margin-top:14px}.flow span{background:#193652;padding:8px 9px;border-radius:8px;font-size:11px}.flow span.done{background:#164869}.flow span.current{background:var(--blue)}.flow b{text-align:center;color:#70a5f9}.summaryrow{display:flex;justify-content:space-between;padding:9px 0;color:#cad6e4;gap:12px}.summaryrow strong{color:white;text-align:right}.summaryrow.total{font-size:18px;border-top:1px solid #2a4765;margin-top:5px;padding-top:14px}
.searchbar{display:grid;grid-template-columns:1fr 220px auto;gap:9px}.toast{position:fixed;right:22px;bottom:22px;z-index:20;background:#10243e;color:#fff;padding:12px 15px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;transform:translateY(15px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}
.backupbox{display:grid;grid-template-columns:1fr 1fr;gap:15px}.info{background:#f7f9fc;border:1px solid var(--line);border-radius:13px;padding:16px}.info h4{margin:0 0 7px}.info p{font-size:12px;color:var(--muted);line-height:1.5}.backupstatus{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-radius:12px;margin-bottom:15px;background:var(--greenbg);border:1px solid #caeadc}.backupstatus.warn,.backupstatus.amber{background:var(--amberbg);border-color:#f3dfb5}.backupstatus.bad,.backupstatus.red{background:var(--redbg);border-color:#f1cccc}.backupstatus div:last-child{font-size:12px;color:var(--muted)}
.clientmatch{display:none;background:#eef5ff;border:1px solid #d4e4ff;border-radius:10px;padding:11px 12px;font-size:12px}.clientmatch.show{display:block}.timeline{display:flex;flex-direction:column;gap:8px;margin-top:12px}.timelineitem{display:flex;justify-content:space-between;gap:12px;background:#f7f9fc;border-radius:9px;padding:9px 10px;font-size:11px}.timelineitem strong{font-size:11px}.right{text-align:right}.nowrap{white-space:nowrap}

.kpigrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.brandlist{display:flex;flex-direction:column;gap:11px}.brandrow{display:grid;grid-template-columns:150px 1fr 55px;align-items:center;gap:12px}.bartrack{height:10px;background:#edf1f6;border-radius:999px;overflow:hidden}.barfill{height:100%;background:var(--blue);border-radius:999px}.eventgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.sectionnote{font-size:12px;color:var(--muted);line-height:1.5}.statushint{padding:10px 12px;border-radius:10px;background:var(--soft);border:1px solid #d4e4ff;font-size:12px;color:#3e5f8e}.statvalue.smallmoney{font-size:22px}
.cloudgrid{display:grid;grid-template-columns:1.35fr .65fr;gap:15px}
.cloudstatus{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:750}
.clouddot{width:10px;height:10px;border-radius:50%;background:#9aa6b5;box-shadow:0 0 0 4px rgba(154,166,181,.12)}
.clouddot.green{background:var(--green);box-shadow:0 0 0 4px rgba(22,135,90,.12)}
.clouddot.amber{background:var(--amber);box-shadow:0 0 0 4px rgba(199,131,24,.12)}
.clouddot.red{background:var(--red);box-shadow:0 0 0 4px rgba(194,77,77,.12)}
.cloudurl{font-family:Consolas,monospace;font-size:12px}
.cloudactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.installbtn{display:none}.installbtn.show{display:inline-flex}
.netstatus{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:11px;font-weight:800;color:#516176}.netstatus .netdot{width:8px;height:8px;border-radius:50%;background:#9aa6b5}.netstatus.online .netdot{background:var(--green)}.netstatus.offline{background:var(--amberbg);border-color:#f3dfb5;color:#8c5c12}.netstatus.offline .netdot{background:var(--amber)}.netstatus.pending{background:var(--soft);border-color:#d4e4ff;color:#315c98}.netstatus.pending .netdot{background:var(--blue)}
@media(max-width:950px){.cloudgrid{grid-template-columns:1fr}}
@media(max-width:950px){.kpigrid,.eventgrid{grid-template-columns:1fr}.brandrow{grid-template-columns:110px 1fr 45px}}

@media(max-width:950px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:relative;flex-direction:row;align-items:center;overflow:auto}.brand{margin:0 12px 0 0}.brandname,.brandsub,.foot{display:none}.nav{flex-direction:row}.main{padding:20px}.formlayout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.alerts{grid-template-columns:1fr}.sidecard{order:-1}}
@media(max-width:620px){.stats{grid-template-columns:1fr}.grid,.searchbar,.backupbox{grid-template-columns:1fr}.full{grid-column:1}.hero{flex-direction:column;align-items:flex-start;gap:18px}.top h1{font-size:25px}.nav button{white-space:nowrap}.actions .btn{width:100%}}
@media print{.sidebar,.top,.no-print,.actions{display:none!important}.shell{display:block}.main{padding:0}.panel{border:0}.sidecard{background:#fff;color:#000;border:1px solid #ddd}.sidecard *{color:#000!important}}

<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brandmark">NQN</div><div><div class="brandname">NQN Service</div><div class="brandsub">Gestión técnica · V9 completa</div></div></div>
    <div class="nav">
      <button id="nav-dashboard" class="active" onclick="showView('dashboard')">⌂ Dashboard</button>
      <button id="nav-nuevo" onclick="newOrder()">＋ Nuevo ingreso</button>
      <button id="nav-ordenes" onclick="showView('ordenes')">⌕ Buscar órdenes</button>
      <button id="nav-clientes" onclick="showView('clientes')">◎ Clientes</button>
      <button id="nav-kpis" onclick="showView('kpis')">▥ KPIs</button>
      <button id="nav-cleris" onclick="showView('cleris')">★ Cleris Eventos</button>
      <button id="nav-backup" onclick="showView('backup')">⇩ Copias</button>
      <button id="installPwaBtn" class="installbtn" onclick="installPwa()">⬇ Instalar app</button>
    </div>
    <div class="foot">Funciona sin internet.<br>Sincronizada · Instalable en Android.</div>
  </aside>

  <main class="main">
    <div class="top"><div><div class="eyebrow">SERVICIO TÉCNICO</div><h1 id="pageTitle">Panel principal</h1></div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end"><div id="netStatus" class="netstatus"><span class="netdot"></span><span>Iniciando</span></div><div class="muted" id="today"></div></div></div>
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
const KEY_V1='nqn_service_orders_v1';
const KEY='nqn_service_orders_v2';
const KEY_MIRROR='nqn_service_orders_v2_mirror';
const KEY_SETTINGS='nqn_service_settings_v2';
const KEY_SNAPSHOTS='nqn_service_snapshots_v2';
const KEY_EVENTS='nqn_service_cleris_events_v1';
const KEY_EVENTS_MIRROR='nqn_service_cleris_events_v1_mirror';
const ESTADOS=['En taller','Entregado'];
const TIPOS=['Lavarropas','Lavavajillas','Microondas','Otro'];
const PAGOS=['Pendiente','Efectivo','Mercado Pago','Transferencia','Mixto'];
const KEY_MODELS='nqn_service_custom_models_v1';
const KEY_CLOUD_QUEUE='nqn_service_cloud_queue_v1';
let cloudTimer=null;
let cloudSyncRunning=false;
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;updateInstallButton()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;updateInstallButton();toast('NQN Service instalada')});
function updateInstallButton(){let b=document.getElementById('installPwaBtn');if(b)b.classList.toggle('show',!!deferredInstallPrompt)}
async function installPwa(){if(!deferredInstallPrompt){alert('Si Chrome no muestra la instalación todavía, recargá la página una vez y volvé a intentar.');return}deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(e){}deferredInstallPrompt=null;updateInstallButton()}
const OFFLINE_CACHE='nqn-service-v9-completa';
const OFFLINE_ASSETS=['./','./index.html','./NQN_SERVICE_ESTABLE.html','./manifest.webmanifest','./turnos.js','./icons/icon-192.png','./icons/icon-512.png'];
let swReloading=false;
async function ensureOfflineReady(){
  if(!('serviceWorker' in navigator)||!location.protocol.startsWith('http'))return false;
  try{
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(swReloading)return;
      if(sessionStorage.getItem('nqn_sw_v8_reload')==='1')return;
      swReloading=true;sessionStorage.setItem('nqn_sw_v8_reload','1');location.reload();
    });
    const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
    try{await reg.update()}catch(e){}
    await navigator.serviceWorker.ready;
    // Calienta el caché explícitamente. Si la red falla, el service worker conserva lo ya cacheado.
    if('caches' in window && navigator.onLine){
      const cache=await caches.open(OFFLINE_CACHE);
      await Promise.all(OFFLINE_ASSETS.map(async u=>{
        try{const r=await fetch(u,{cache:'reload'});if(r&&r.ok)await cache.put(u,r.clone())}catch(e){}
      }));
    }
    try{localStorage.setItem('nqn_offline_ready_v8','1')}catch(e){}
    updateNetworkStatus();
    return true;
  }catch(e){console.warn('Modo offline no preparado',e);return false}
}
window.addEventListener('load',()=>ensureOfflineReady());

function cloudQueue(){
  let q=safeJSON(localStorage.getItem(KEY_CLOUD_QUEUE)||'[]',[]);
  return Array.isArray(q)?q:[];
}
function setCloudQueue(q){
  try{localStorage.setItem(KEY_CLOUD_QUEUE,JSON.stringify(Array.isArray(q)?q:[]))}catch(e){}
}
function cloudDeviceId(){
  let s=getSettings();
  if(!s.cloudDeviceId){s.cloudDeviceId=(crypto.randomUUID?crypto.randomUUID():'dev-'+Date.now()+'-'+Math.random().toString(36).slice(2));setSettings(s)}
  return s.cloudDeviceId;
}
function cloudConfig(){
  let s=getSettings();
  return {enabled:!!s.cloudEnabled,url:String(s.cloudUrl||'').trim(),token:String(s.cloudToken||'').trim(),everSynced:!!s.cloudEverSynced,lastSync:s.lastCloudSync||'',lastError:s.lastCloudError||'',sheetUrl:s.cloudSheetUrl||'',backupFolderUrl:s.cloudBackupFolderUrl||''};
}
function cloudConfigured(){let c=cloudConfig();return c.enabled&&!!c.token&&/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/i.test(c.url)}
function queueCloudOp(type,id,data=null,at=nowISO()){
  let low=type.toLowerCase(),entity=low.includes('cash')?'cash':(low.includes('event')?'event':'order');
  let q=cloudQueue().filter(op=>!(op.entity===entity&&String(op.id)===String(id)));
  q.push({opId:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),type,entity,id:String(id),at,data});
  setCloudQueue(q);
  updateNetworkStatus();
  cloudAutoSyncSoon();
}
function bootstrapCloudQueue(){
  let s=getSettings();
  if(s.cloudEverSynced)return;
  let q=cloudQueue(),seen=new Set(q.map(x=>x.entity+':'+x.id));
  load().forEach(r=>{let k='order:'+r.id;if(!seen.has(k)){q.push({opId:'boot-o-'+r.id,type:'upsertOrder',entity:'order',id:String(r.id),at:r.actualizado||r.creado||nowISO(),data:r});seen.add(k)}});
  loadEvents().forEach(e=>{let k='event:'+e.id;if(!seen.has(k)){q.push({opId:'boot-e-'+e.id,type:'upsertEvent',entity:'event',id:String(e.id),at:e.actualizado||e.creado||nowISO(),data:e});seen.add(k)}});
  if(typeof loadCashClosings==='function')loadCashClosings().forEach(c=>{let k='cash:'+c.id;if(!seen.has(k)){q.push({opId:'boot-c-'+c.id,type:'upsertCash',entity:'cash',id:String(c.id),at:c.actualizado||c.creado||nowISO(),data:c});seen.add(k)}});
  setCloudQueue(q);
}
function cloudAutoSyncSoon(){
  if(!cloudConfigured()||!navigator.onLine)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>cloudSync(true),1200);
}
function jsonpPull(url,token){
  return new Promise((resolve,reject)=>{
    let cb='__nqnCloudCb_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script'),done=false;
    let timer=setTimeout(()=>finish(new Error('La nube no respondió a tiempo')),12000);
    function finish(err,data){
      if(done)return;done=true;clearTimeout(timer);
      try{delete window[cb]}catch(e){window[cb]=undefined}
      script.remove();
      err?reject(err):resolve(data);
    }
    window[cb]=(data)=>finish(null,data);
    let sep=url.includes('?')?'&':'?';
    script.src=url+sep+'action=pull&token='+encodeURIComponent(token)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
    script.onerror=()=>finish(new Error('No se pudo consultar la base de Google Drive'));
    document.head.appendChild(script);
  });
}
function opReflected(op,state){
  let rows=op.entity==='order'?(state.ordenes||[]):(op.entity==='cash'?(state.cierrescaja||[]):(state.cleriseventos||[]));
  let hit=rows.find(x=>String(x.id)===String(op.id));
  if(op.type.startsWith('delete'))return !hit;
  if(!hit)return false;
  let remoteAt=new Date(hit.actualizado||hit.creado||0).getTime(),localAt=new Date(op.at||op.data?.actualizado||op.data?.creado||0).getTime();
  return !localAt||remoteAt>=localAt;
}
function applyCloudState(state,pending=[]){
  let pendingOrders=new Set(pending.filter(x=>x.entity==='order').map(x=>String(x.id)));
  let pendingEvents=new Set(pending.filter(x=>x.entity==='event').map(x=>String(x.id)));
  let pendingCash=new Set(pending.filter(x=>x.entity==='cash').map(x=>String(x.id)));
  let deletedCash=new Set(pending.filter(x=>x.entity==='cash'&&x.type==='deleteCash').map(x=>String(x.id)));
  let remoteOrders=Array.isArray(state.ordenes)?ensureClientNumbers(state.ordenes.map(normalizeOrder)):[];
  let remoteEvents=Array.isArray(state.cleriseventos)?state.cleriseventos:[];
  let remoteCash=Array.isArray(state.cierrescaja)?state.cierrescaja:[];
  if(pendingOrders.size){
    let map=new Map(remoteOrders.map(r=>[String(r.id),r]));
    load().forEach(r=>{if(pendingOrders.has(String(r.id)))map.set(String(r.id),r)});
    remoteOrders=ensureClientNumbers([...map.values()].map(normalizeOrder));
  }
  if(pendingEvents.size){
    let map=new Map(remoteEvents.map(e=>[String(e.id),e]));
    loadEvents().forEach(e=>{if(pendingEvents.has(String(e.id)))map.set(String(e.id),e)});
    remoteEvents=[...map.values()];
  }
  if(typeof loadCashClosings==='function'&&typeof saveCashClosings==='function'){
    if(deletedCash.size)remoteCash=remoteCash.filter(c=>!deletedCash.has(String(c.id)));
    if(pendingCash.size){
      let map=new Map(remoteCash.map(c=>[String(c.id),c]));
      loadCashClosings().forEach(c=>{if(pendingCash.has(String(c.id)))map.set(String(c.id),c)});
      remoteCash=[...map.values()];
    }
    saveCashClosings(remoteCash);
  }
  writeRowsKey(KEY_MIRROR,remoteOrders);writeRowsKey(KEY,remoteOrders);
  saveEvents(remoteEvents);
}
async function cloudSync(silent=false){
  if(cloudSyncRunning)return false;
  let c=cloudConfig();
  if(!c.enabled){if(!silent)alert('Activá la sincronización en Copias.');return false}
  if(!cloudConfigured()){if(!silent)alert('Pegá la URL /exec y la clave privada de sincronización.');return false}
  if(!navigator.onLine){if(!silent)toast('Sin internet: los cambios quedan pendientes');return false}
  cloudSyncRunning=true;
  try{
    bootstrapCloudQueue();
    let q=cloudQueue();
    if(q.length){
      await fetch(c.url,{method:'POST',mode:'no-cors',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'apply',token:c.token,device:cloudDeviceId(),ops:q})});
    }
    let state=await jsonpPull(c.url,c.token);
    if(!state||state.ok===false)throw new Error(state?.error||'Respuesta de nube inválida');
    let remaining=q.filter(op=>!opReflected(op,state));
    setCloudQueue(remaining);
    updateNetworkStatus();
    applyCloudState(state,remaining);

function updateNetworkStatus(){

  const pending=cloudQueue().length;
  if(!navigator.onLine){el.className='netstatus offline';el.innerHTML='<span class="netdot"></span><span>Sin conexión · guardado local</span>';return}
  if(pending){el.className='netstatus pending';el.innerHTML='<span class="netdot"></span><span>En línea · '+pending+' pendiente'+(pending===1?'':'s')+'</span>';return}
  el.className='netstatus online';el.innerHTML='<span class="netdot"></span><span>En línea</span>';

function cloudStatus(){
  let c=cloudConfig(),pending=cloudQueue().length;

  if(!cloudConfigured())return {cls:'amber',label:'Falta configurar Drive',detail:'Pegá la URL del Web App y la clave privada.',pending};
  if(!navigator.onLine)return {cls:'amber',label:'Sin conexión',detail:pending?pending+' cambio(s) pendientes para subir.':'Se sincronizará cuando vuelva internet.',pending};
  if(c.lastError)return {cls:'red',label:'Error de sincronización',detail:c.lastError,pending};
  if(pending)return {cls:'amber',label:'Cambios pendientes',detail:pending+' cambio(s) esperando sincronización.',pending};
  if(c.lastSync)return {cls:'green',label:'Drive sincronizado',detail:'Última sincronización '+prettyDateTime(c.lastSync)+'.',pending};

  let s=getSettings(),changed=(s.cloudUrl&&s.cloudUrl!==url)||(s.cloudToken&&s.cloudToken!==token);
  s.cloudUrl=url;s.cloudToken=token;s.cloudEnabled=enabled;

function normalizeOrder(r,index=0){
  let fechaIngreso=r.fechaIngreso||r.fecha||localISODate();

function ensureClientNumbers(rows){
  let phoneMap=new Map(),next=1001;
  rows.forEach(r=>{if(r.clienteNumero>=next)next=r.clienteNumero+1});
  rows.sort((a,b)=>(a.numero||0)-(b.numero||0)).forEach(r=>{
    let p=normPhone(r.telefono),key=p||('name:'+r.cliente.toLowerCase().trim());
    if(phoneMap.has(key))r.clienteNumero=phoneMap.get(key);

  });
  return rows;
}

function load(){

function save(rows,reason='Guardado automático'){

    <div class="field short"><label>Fecha de ingreso</label><input id="fechaIngreso" type="date" value="${esc(r.fechaIngreso)}" readonly></div>
    ${isNew?'':`<div class="field short"><label>Fecha de entrega</label><input id="fechaEntrega" type="date" value="${esc(r.fechaEntrega||'')}"><div class="hint">Al cargar una fecha, la orden pasa automáticamente a <strong>Entregado</strong>.</div></div>`}
    <div class="field"><label>Nombre y apellido *</label><input id="cliente" value="${esc(r.cliente)}" required autofocus placeholder="Ej. Paula García"></div>
    <div class="field"><label>Teléfono *</label><input id="telefono" value="${esc(r.telefono)}" required placeholder="Ej. 299 4000000" oninput="checkExistingClient()"></div>
    ${brandModelFields(r.marcaModelo)}
    <div class="field full"><div id="clientMatch" class="clientmatch"></div></div>
    <div class="field"><label>Tipo de equipo</label><select id="tipo">${TIPOS.map(x=>`<option ${r.tipo===x?'selected':''}>${x}</option>`).join('')}</select></div>
    ${isNew?'':`<div class="field"><label>Estado</label><input value="${r.fechaEntrega?'Entregado':'En taller'}" readonly></div>`}
    <div class="field full"><label>Falla / diagnóstico</label><textarea id="falla" rows="3" placeholder="Qué problema presenta el equipo">${esc(r.falla)}</textarea></div>
    <div class="field full"><label>Accesorios</label><input id="accesorios" value="${esc(r.accesorios)}" placeholder="Mangueras, tapa, cable, etc."></div>
    <div class="field full"><label>Observaciones</label><textarea id="observaciones" rows="3">${esc(r.observaciones)}</textarea></div>
    <div class="field"><label>Monto total</label><input id="monto" type="number" min="0" step="1000" value="${Number(r.monto||0)}"></div>
    <div class="field"><label>Pagado</label><input id="pagado" type="number" min="0" step="1000" value="${Number(r.pagado||0)}"></div>
    <div class="field"><label>Medio de pago</label><select id="medioPago">${PAGOS.map(x=>`<option ${r.medioPago===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="field"><label>Saldo</label><input id="saldoPreview" value="${money(balance(r))}" readonly></div>
    <div class="actions full">
      ${isNew?`<button type="button" class="btn secondary" onclick="renderDashboard()">Cancelar</button>`:`<button type="button" class="btn secondary" onclick="newOrderSameClient('${esc(r.id)}')">＋ Mismo cliente</button><button type="button" class="btn secondary" onclick="printReceipt('${esc(r.id)}')">Comprobante / PDF</button><button type="button" class="btn danger" onclick="deleteOrder('${esc(r.id)}')">Eliminar</button>`}
      <button class="btn primary" type="submit">${isNew?'Guardar ingreso':'Guardar cambios'}</button>
    </div>
  </form>`;
}

function checkExistingClient(){
  let tel=document.getElementById('telefono')?.value||'',p=normPhone(tel),box=document.getElementById('clientMatch');
  if(!box)return;
  if(p.length<6){box.classList.remove('show');box.innerHTML='';return}
  let history=load().filter(r=>normPhone(r.telefono)===p).sort((a,b)=>b.numero-a.numero);
  if(!history.length){box.classList.remove('show');box.innerHTML='';let side=document.getElementById('clientSide');if(side)side.innerHTML='';return}
  let c=history[0];
  box.innerHTML=`Cliente existente: <strong>${esc(c.cliente)}</strong> · C${fmtClient(c.clienteNumero)} · ${history.length} orden${history.length===1?'':'es'} previa${history.length===1?'':'s'}. <button type="button" class="btn secondary small" onclick="useClient('${esc(c.id)}')">Usar datos</button>`;
  box.classList.add('show');
  let side=document.getElementById('clientSide');if(side)side.innerHTML=`<div style="margin-top:14px;padding-top:14px;border-top:1px solid #2a4765"><div class="muted" style="color:#91a5ba">CLIENTE DETECTADO</div><div style="font-weight:800;margin-top:4px">${esc(c.cliente)}</div><div style="font-size:12px;color:#c8d5e4;margin-top:4px">C${fmtClient(c.clienteNumero)} · ${history.length} órdenes</div></div>`;
}
function useClient(orderId){let r=load().find(x=>x.id===orderId);if(!r)return;document.getElementById('cliente').value=r.cliente;document.getElementById('telefono').value=r.telefono;toast('Datos del cliente cargados')}
function findClientNumber(phone,name){let p=normPhone(phone);let rows=load();let hit=rows.find(r=>p&&normPhone(r.telefono)===p);if(hit)return hit.clienteNumero;let n=(name||'').toLowerCase().trim();hit=rows.find(r=>!p&&r.cliente.toLowerCase().trim()===n);return hit?hit.clienteNumero:nextClient()}

function submitOrder(ev,isNew){
  ev.preventDefault();
  let rows=load(),now=nowISO(),fechaEntrega=isNew?'':(document.getElementById('fechaEntrega')?.value||'');
  let obj={
    fechaIngreso:document.getElementById('fechaIngreso').value,fechaEntrega,
    cliente:document.getElementById('cliente').value.trim(),telefono:document.getElementById('telefono').value.trim(),
    marcaModelo:collectBrandModel(),tipo:document.getElementById('tipo').value,falla:document.getElementById('falla').value.trim(),
    accesorios:document.getElementById('accesorios').value.trim(),observaciones:document.getElementById('observaciones').value.trim(),
    estado:fechaEntrega?'Entregado':'En taller',monto:Number(document.getElementById('monto').value||0),pagado:Number(document.getElementById('pagado').value||0),
    medioPago:document.getElementById('medioPago').value,actualizado:now
  };
  if(!obj.marcaModelo){alert('Elegí la marca y el modelo. Si no aparecen en la lista, usá “Otra marca” / “Otro modelo”.');return}
  if(obj.pagado>obj.monto&&obj.monto>0){if(!confirm('El monto pagado es mayor al total. ¿Guardar igual?'))return}
  if(isNew){
    obj.id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString());obj.numero=nextOrder();obj.clienteNumero=findClientNumber(obj.telefono,obj.cliente);obj.creado=now;
    obj.fechasEstado={'En taller':now};obj.historial=[{fecha:now,estado:'En taller'}];rows.push(obj);save(rows,'Antes de crear orden');queueCloudOp('upsertOrder',obj.id,obj,obj.actualizado||obj.creado);toast('Orden '+fmtOrder(obj.numero)+' guardada');editOrder(obj.id);
  }else{
    let i=rows.findIndex(r=>r.id===editingId);if(i<0)return;let old=rows[i];
    obj.id=old.id;obj.numero=old.numero;obj.clienteNumero=findClientNumber(obj.telefono,obj.cliente)||old.clienteNumero;obj.creado=old.creado;obj.fechasEstado={...(old.fechasEstado||{})};obj.historial=[...(old.historial||[])];
    if(obj.estado!==old.estado){obj.fechasEstado[obj.estado]=now;obj.historial.push({fecha:now,estado:obj.estado})}
    rows[i]=obj;save(rows,'Antes de editar orden #'+fmtOrder(obj.numero));queueCloudOp('upsertOrder',obj.id,obj,obj.actualizado);toast(obj.estado==='Entregado'?'Orden cerrada como entregada':'Orden actualizada');editOrder(obj.id);
  }
}

function renderOrders(){
  title('Buscar órdenes');setNav('ordenes');
  document.getElementById('view').innerHTML=`<section class="panel" style="margin-top:0"><div class="searchbar"><input id="searchQ" oninput="filterOrders()" placeholder="Orden, cliente, teléfono, equipo o cliente Nº..."><select id="searchEstado" onchange="filterOrders()"><option value="">Todos los estados</option>${ESTADOS.map(e=>`<option>${e}</option>`).join('')}</select><button class="btn primary" onclick="newOrder()">＋ Nueva</button></div></section><section class="panel"><div class="panelhead"><div><div class="eyebrow">RESULTADOS</div><h3 id="countTitle"></h3></div></div><div id="ordersResult"></div></section>`;
  filterOrders();
}
function filterOrders(){
  let q=(document.getElementById('searchQ')?.value||'').toLowerCase().trim(),e=document.getElementById('searchEstado')?.value||'';
  let rows=load().filter(r=>{let hay=[fmtOrder(r.numero),fmtClient(r.clienteNumero),r.cliente,r.telefono,r.marcaModelo,r.tipo].join(' ').toLowerCase().includes(q);return hay&&(!e||r.estado===e)}).sort((a,b)=>b.numero-a.numero);
  document.getElementById('countTitle').textContent=rows.length+' órdenes';document.getElementById('ordersResult').innerHTML=rows.length?orderTable(rows):'<div class="empty">No encontré órdenes con esos filtros.</div>';
}

function editOrder(id){
  let r=load().find(x=>x.id===id);if(!r)return;editingId=id;currentView='editar';setNav('ordenes');title('Orden #'+fmtOrder(r.numero));
  let history=load().filter(x=>x.id!==r.id&&normPhone(x.telefono)&&normPhone(x.telefono)===normPhone(r.telefono)).sort((a,b)=>b.numero-a.numero).slice(0,5);
  document.getElementById('view').innerHTML=`<div class="formlayout"><section class="panel" style="margin-top:0"><div class="panelhead"><div><div class="eyebrow">INGRESÓ ${prettyDate(r.fechaIngreso)}</div><h3>${esc(r.cliente)} · C${fmtClient(r.clienteNumero)}</h3></div><span class="badge ${badgeClass(r)}">${esc(r.estado)}</span></div>${orderForm(r,false)}</section><aside class="sidecard"><div class="eyebrow" style="color:#8fb9ff">RESUMEN</div><div class="summaryrow"><span>Total</span><strong>${money(r.monto)}</strong></div><div class="summaryrow"><span>Pagado</span><strong>${money(r.pagado)}</strong></div><div class="summaryrow"><span>Medio</span><strong>${esc(r.medioPago)}</strong></div><div class="summaryrow total"><span>Saldo</span><strong>${money(balance(r))}</strong></div><div class="summaryrow"><span>Días en taller</span><strong>${daysInShop(r)}</strong></div><div class="summaryrow"><span>Estado</span><strong>${esc(r.estado)}</strong></div>${r.fechaEntrega?`<div class="summaryrow"><span>Entregado</span><strong>${prettyDate(r.fechaEntrega)}</strong></div>`:''}<div style="margin-top:12px;color:#91a5ba;font-size:11px">TELÉFONO</div><div style="font-size:18px;font-weight:800;margin-top:4px">${esc(r.telefono)}</div>${history.length?`<div style="margin-top:18px;color:#91a5ba;font-size:11px">OTRAS ÓRDENES DEL CLIENTE</div><div class="timeline">${history.map(x=>`<div class="timelineitem" style="background:#193652;color:#dce8f5;cursor:pointer" onclick="editOrder('${esc(x.id)}')"><strong>#${fmtOrder(x.numero)} ${esc(x.marcaModelo)}</strong><span>${prettyDate(x.fechaIngreso)}</span></div>`).join('')}</div>`:''}</aside></div>`;
  attachBalancePreview();
}
function attachBalancePreview(){let m=document.getElementById('monto'),p=document.getElementById('pagado'),s=document.getElementById('saldoPreview');if(!m||!p||!s)return;let f=()=>s.value=money(Math.max(0,Number(m.value||0)-Number(p.value||0)));m.addEventListener('input',f);p.addEventListener('input',f)}
function newOrderSameClient(id){let r=load().find(x=>x.id===id);if(r)newOrder({cliente:r.cliente,telefono:r.telefono})}
function deleteOrder(id){if(!confirm('¿Eliminar esta orden? Se guardará una copia automática anterior, pero conviene evitar eliminar si solo querés cambiar el estado.'))return;let rows=load().filter(r=>r.id!==id);save(rows,'Antes de eliminar orden');queueCloudOp('deleteOrder',id,null,nowISO());toast('Orden eliminada');renderOrders()}

function renderClients(){
  title('Clientes');setNav('clientes');let rows=load(),map=new Map();
  rows.forEach(r=>{let key=normPhone(r.telefono)||('c'+r.clienteNumero);if(!map.has(key))map.set(key,{cliente:r.cliente,telefono:r.telefono,numero:r.clienteNumero,orders:[]});let c=map.get(key);c.cliente=r.cliente;c.telefono=r.telefono;c.numero=r.clienteNumero;c.orders.push(r)});

function showClientOrders(phone,clientNumber){let rows=load().filter(r=>(phone&&normPhone(r.telefono)===phone)||(!phone&&r.clienteNumero===clientNumber)).sort((a,b)=>b.numero-a.numero);if(!rows.length)return;title(rows[0].cliente+' · C'+fmtClient(rows[0].clienteNumero));document.getElementById('view').innerHTML=`<section class="panel" style="margin-top:0"><div class="panelhead"><div><div class="eyebrow">HISTORIAL DEL CLIENTE</div><h3>${rows.length} órdenes</h3></div><button class="btn primary" onclick="newOrderSameClient('${esc(rows[0].id)}')">＋ Nueva orden</button></div>${orderTable(rows)}</section>`}

  let ingresos=rows.filter(r=>monthKey(r.fechaIngreso)===mk),entregados=rows.filter(r=>r.estado==='Entregado'&&monthKey(r.fechaEntrega)===mk);

function renderCleris(){

/th><th>Observaciones</th><th></th></tr></thead><tbody>${sorted.map(e=>`<tr><td>${prettyDate(e.fecha)}</td><td><strong>${esc(e.descripcion)}</strong></td><td>${esc(e.medioPago||'-')}</td><td><strong>${money(e.monto)}</strong></td><td>${esc(e.observaciones||'-')}</td><td class="right"><button class="btn danger small" onclick="deleteEvent('${esc(e.id)}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no cargaste eventos de Cleris.</div>'}</section>`;

function submitEvent(ev){ev.preventDefault();let rows=loadEvents(),now=nowISO(),obj={id:String(Date.now()),fecha:document.getElementById('eventFecha').value,descripcion:document.getElementById('eventDesc').value.trim(),monto:Number(document.getElementById('eventMonto').value||0),medioPago:document.getElementById('eventPago').value,observaciones:document.getElementById('eventObs').value.trim(),creado:now,actualizado:now};rows.push(obj);saveEvents(rows);queueCloudOp('upsertEvent',obj.id,obj,obj.actualizado);toast('Evento de Cleris guardado');renderCleris()}
function deleteEvent(id){if(!confirm('¿Eliminar este evento de Cleris?'))return;saveEvents(loadEvents().filter(e=>String(e.id)!==String(id)));queueCloudOp('deleteEvent',id,null,nowISO());toast('Evento eliminado');renderCleris()}

function externalBackupStatus(){
  let s=getSettings(),last=s.lastExternalBackup;if(!last)return {className:'red',title:'Sin copia externa',text:'Descargá una copia desde “Copias”.'};
  let days=Math.floor((Date.now()-new Date(last).getTime())/86400000);if(days>=7)return {className:'red',title:'Backup externo atrasado',text:'Última copia hace '+days+' días.'};if(days>=3)return {className:'amber',title:'Conviene hacer backup',text:'Última copia hace '+days+' días.'};return {className:'green',title:'Backup externo al día',text:'Última copia '+prettyDateTime(last)+'.'}
}
function runHealthCheck(){
  let problems=[];
  if(!storageSelfTest())problems.push('El navegador no permite almacenamiento local.');
  let rows=load(),primary=readRowsKey(KEY),mirror=readRowsKey(KEY_MIRROR);
  if(!validRows(primary))problems.push('La copia principal no es válida.');
  if(!validRows(mirror))problems.push('La copia espejo no es válida.');
  if(validRows(primary)&&validRows(mirror)&&primary.length!==mirror.length)problems.push('Principal y espejo tienen distinta cantidad de órdenes.');
  let evA=loadEventsKey(KEY_EVENTS),evB=loadEventsKey(KEY_EVENTS_MIRROR);if(evA.length!==evB.length)problems.push('Principal y espejo de Cleris tienen distinta cantidad de eventos.');
  if(problems.length){alert('Revisión del sistema\n\n'+problems.join('\n'));return false}
  alert('Sistema OK.\n\nAlmacenamiento: OK\nCopia principal: OK\nCopia espejo: OK\nÓrdenes verificadas: '+rows.length+'\nEventos Cleris: '+loadEvents().length);
  return true;
}

  window.opReflected=function(op,state){

    const hit=rows.find(x=>String(x.id)===String(op.id));if(String(op.type||'').startsWith('delete'))return !hit;if(!hit)return false;
    const remoteAt=new Date(hit.actualizado||hit.creado||0).getTime(),localAt=new Date(op.at||op.data?.actualizado||op.data?.creado||0).getTime();return !localAt||remoteAt>=localAt;
  };
  window.applyCloudState=function(state,pending=[]){
    const pOrders=new Set(pending.filter(x=>x.entity==='order').map(x=>String(x.id))),pEvents=new Set(pending.filter(x=>x.entity==='event').map(x=>String(x.id))),pCash=new Set(pending.filter(x=>x.entity==='cash').map(x=>String(x.id))),pOps=new Set(pending.filter(x=>x.entity==='operator').map(x=>String(x.id)));
    const dCash=new Set(pending.filter(x=>x.entity==='cash'&&x.type==='deleteCash').map(x=>String(x.id))),dOps=new Set(pending.filter(x=>x.entity==='operator'&&x.type==='deleteOperator').map(x=>String(x.id)));
    let ro=Array.isArray(state.ordenes)?ensureClientNumbers(state.ordenes.map(normalizeOrder)):[],re=Array.isArray(state.cleriseventos)?state.cleriseventos:[],rc=Array.isArray(state.cierrescaja)?state.cierrescaja.map(normalizeCashClosing):[],rp=Array.isArray(state.operadores)?state.operadores.map(normalizeOperator):[];
    if(pOrders.size){let map=new Map(ro.map(x=>[String(x.id),x]));load().forEach(x=>{if(pOrders.has(String(x.id)))map.set(String(x.id),x)});ro=ensureClientNumbers([...map.values()].map(normalizeOrder))}
    if(pEvents.size){let map=new Map(re.map(x=>[String(x.id),x]));loadEvents().forEach(x=>{if(pEvents.has(String(x.id)))map.set(String(x.id),x)});re=[...map.values()]}
    if(dCash.size)rc=rc.filter(x=>!dCash.has(String(x.id)));if(pCash.size){let map=new Map(rc.map(x=>[String(x.id),x]));window.loadCashClosings().forEach(x=>{if(pCash.has(String(x.id)))map.set(String(x.id),x)});rc=[...map.values()]}
    if(dOps.size)rp=rp.filter(x=>!dOps.has(String(x.id)));if(pOps.size){let map=new Map(rp.map(x=>[String(x.id),x]));window.loadOperators().forEach(x=>{if(pOps.has(String(x.id)))map.set(String(x.id),x)});rp=[...map.values()]}
    writeRowsKey(KEY_MIRROR,ro);writeRowsKey(KEY,ro);saveEvents(re);window.saveCashClosings(rc);window.saveOperators(rp);
  };
  window.refreshViewAfterCloudSync=function(){
    const op=session();if(!op){renderLoginOrSetup();return}applyRoleNav();updateAuthBar();
    if(currentView==='nuevo'||currentView==='editar')return;
    const renderers={dashboard:window.renderDashboard,ordenes:renderOrders,clientes:renderClients,kpis:window.renderKPIs,cleris:window.renderCleris,caja:window.showCashSummary,operadores:window.renderOperators,backup:window.renderBackup};
    const fn=renderers[currentView];if(typeof fn==='function')fn();
  };

  window.showView=function(v){
    if(!session()){renderLoginOrSetup();return}
    if(ADMIN_VIEWS.has(v)&&!window.isAdmin()){toast('Esta sección es solo para administrador');window.newOrder();return}
    if(v==='caja')return window.showCashSummary();if(v==='operadores')return window.renderOperators();return coreShowView(v);
  };
  window.renderDashboard=function(){if(!window.isAdmin())return window.newOrder();return coreRenderDashboard()};
  window.renderKPIs=function(){if(!window.isAdmin())return window.newOrder();return coreRenderKPIs()};
  window.renderCleris=function(){if(!window.isAdmin())return window.newOrder();return coreRenderCleris()};
  window.renderBackup=function(){if(!window.isAdmin())return window.newOrder();return coreRenderBackup()};

  function cashValue(id){return document.getElementById(id)?.value??''}function cashNum(id){return Math.max(0,Number(cashValue(id)||0))}
  function cashPreview(){const t=cashTotals({efectivo:cashNum('cashEfectivo'),mercadoPago:cashNum('cashMP'),tarjetas:cashNum('cashTarjetas'),notaCredito:cashNum('cashNC'),gastos:cashNum('cashGastos')});const a=document.getElementById('cashTotal'),b=document.getElementById('cashNeto');if(a)a.textContent=m(t.ingresos);if(b)b.textContent=m(t.neto)}
  window.showCashSummary=function(editId=''){
    const op=session();if(!op)return renderLoginOrSetup();currentView='caja';editingId=null;setNav('caja');title('Resumen de caja diario');
    const all=window.loadCashClosings(),hit=editId?all.find(x=>String(x.id)===String(editId)):null;
    if(hit&&!window.isAdmin()&&String(hit.operadorId||'')!==String(op.id)&&String(hit.operador||'').toLowerCase()!==op.nombre.toLowerCase()){toast('No podés editar el cierre de otro operador');return window.showCashSummary()}
    const r=hit||{fecha:localDay(),operadorId:op.id,operador:op.nombre,efectivo:0,mercadoPago:0,tarjetas:0,notaCredito:0,gastos:0,observaciones:''},tt=cashTotals(r);
    const visible=window.isAdmin()?all:all.filter(x=>String(x.operadorId||'')===String(op.id)||(!x.operadorId&&String(x.operador||'').toLowerCase()===op.nombre.toLowerCase()));
    const sorted=[...visible].sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))||String(b.actualizado).localeCompare(String(a.actualizado)));
    document.getElementById('view').innerHTML=`<section class="panel" style="margin-top:0"><div class="panelhead"><div><div class="eyebrow">CIERRE DIARIO</div><h3>${hit?'Editar cierre':'Cargar cierre del día'}</h3></div><span class="badge">Operador: ${e(r.operador)}</span></div><form class="grid" onsubmit="submitCashSummary(event,'${e(hit?.id||'')}')"><div class="field short"><label>Fecha *</label><input id="cashFecha" type="date" value="${e(r.fecha)}" required></div><div class="field"><label>Operador</label><input value="${e(r.operador)}" readonly></div><div class="field"><label>Efectivo</label><input id="cashEfectivo" class="cashNumber" type="number" min="0" step="1000" value="${Number(r.efectivo||0)}"></div><div class="field"><label>Mercado Pago / transferencias</label><input id="cashMP" class="cashNumber" type="number" min="0" step="1000" value="${Number(r.mercadoPago||0)}"></div><div class="field"><label>Tarjeta crédito / débito</label><input id="cashTarjetas" class="cashNumber" type="number" min="0" step="1000" value="${Number(r.tarjetas||0)}"></div><div class="field"><label>Nota de crédito</label><input id="cashNC" class="cashNumber" type="number" min="0" step="1000" value="${Number(r.notaCredito||0)}"></div><div class="field"><label>Gastos</label><input id="cashGastos" class="cashNumber" type="number" min="0" step="1000" value="${Number(r.gastos||0)}"></div><div class="field full"><label>Observaciones</label><input id="cashObs" value="${e(r.observaciones)}" placeholder="Opcional"></div><div class="field full"><div class="stats" style="grid-template-columns:1fr 1fr;margin:5px 0"><div class="stat soft"><div class="statlabel">Total cobrado</div><div id="cashTotal" class="statvalue smallmoney">${m(tt.ingresos)}</div></div><div class="stat"><div class="statlabel">Neto del día</div><div id="cashNeto" class="statvalue smallmoney">${m(tt.neto)}</div><div class="stathelp">Cobrado − notas de crédito − gastos</div></div></div></div><div class="actions full">${hit?'<button type="button" class="btn secondary" onclick="showCashSummary()">Cancelar</button>':''}<button class="btn primary" type="submit">${hit?'Guardar cambios':'Guardar cierre'}</button></div></form></section><section class="panel"><div class="panelhead"><div><div class="eyebrow">HISTORIAL</div><h3>${window.isAdmin()?'Todos los cierres':'Mis cierres'}</h3></div><span class="badge">${visible.length}</span></div>${sorted.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Operador</th><th>Total</th><th>Nota crédito</th><th>Gastos</th><th>Neto</th><th></th></tr></thead><tbody>${sorted.slice(0,100).map(x=>{const t=cashTotals(x);return `<tr><td><strong>${dateLabel(x.fecha)}</strong></td><td>${e(x.operador)}</td><td><strong>${m(t.ingresos)}</strong></td><td>${m(x.notaCredito)}</td><td>${m(x.gastos)}</td><td><strong>${m(t.neto)}</strong></td><td class="right nowrap"><button class="btn secondary small" onclick="showCashSummary('${e(x.id)}')">Editar</button>${window.isAdmin()?` <button class="btn danger small" onclick="deleteCashSummary('${e(x.id)}')">Eliminar</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay cierres de caja.</div>'}</section>`;
    document.querySelectorAll('.cashNumber').forEach(x=>x.addEventListener('input',cashPreview));
  };
  window.submitCashSummary=function(ev,editId=''){
    ev.preventDefault();const op=session();if(!op)return renderLoginOrSetup();let rows=window.loadCashClosings(),old=editId?rows.find(x=>String(x.id)===String(editId)):null;
    if(old&&!window.isAdmin()&&String(old.operadorId||'')!==String(op.id)&&String(old.operador||'').toLowerCase()!==op.nombre.toLowerCase()){alert('No podés modificar el cierre de otro operador.');return}
    const owner=old||{operadorId:op.id,operador:op.nombre},ts=now(),obj=normalizeCashClosing({id:editId||uid('caja'),fecha:cashValue('cashFecha'),operadorId:owner.operadorId||op.id,operador:owner.operador||op.nombre,efectivo:cashNum('cashEfectivo'),mercadoPago:cashNum('cashMP'),tarjetas:cashNum('cashTarjetas'),notaCredito:cashNum('cashNC'),gastos:cashNum('cashGastos'),observaciones:String(cashValue('cashObs')||'').trim(),creado:old?.creado||ts,actualizado:ts});
    const dup=rows.find(x=>String(x.id)!==String(editId)&&x.fecha===obj.fecha&&((x.operadorId&&x.operadorId===obj.operadorId)||(!x.operadorId&&String(x.operador).toLowerCase()===obj.operador.toLowerCase())));if(dup&&!confirm('Ya existe un cierre para esta fecha y operador. ¿Guardar otro igualmente?'))return;
    if(editId){const i=rows.findIndex(x=>String(x.id)===String(editId));i>=0?rows[i]=obj:rows.push(obj)}else rows.push(obj);window.saveCashClosings(rows);queueCloudOp('upsertCash',obj.id,obj,obj.actualizado);toast(editId?'Cierre actualizado':'Cierre guardado');window.showCashSummary();
  };
  window.deleteCashSummary=function(id){if(!window.isAdmin()){toast('Solo el administrador puede eliminar cierres');return}const rows=window.loadCashClosings(),x=rows.find(r=>String(r.id)===String(id));if(!x)return;if(!confirm('¿Eliminar el cierre de '+dateLabel(x.fecha)+' de '+x.operador+'?'))return;window.saveCashClosings(rows.filter(r=>String(r.id)!==String(id)));queueCloudOp('deleteCash',id,null,now());toast('Cierre eliminado');window.showCashSummary()};

  window.renderOperators=function(editId=''){
    if(!window.isAdmin())return window.newOrder();currentView='operadores';editingId=null;setNav('operadores');title('Operadores');
    const rows=window.loadOperators(),r=editId?rows.find(x=>String(x.id)===String(editId)):null;
    document.getElementById('view').innerHTML=`<section class="panel" style="margin-top:0"><div class="panelhead"><div><div class="eyebrow">ACCESOS</div><h3>${r?'Editar operador':'Nuevo operador'}</h3></div><span class="badge">${rows.filter(x=>x.activo).length} activos</span></div><form class="grid" onsubmit="saveOperatorForm(event,'${e(r?.id||'')}')"><div class="field"><label>Nombre *</label><input id="opName" value="${e(r?.nombre||'')}" required></div><div class="field"><label>Rol</label><select id="opRole"><option value="operador" ${r?.rol!=='admin'?'selected':''}>Operador</option><option value="admin" ${r?.rol==='admin'?'selected':''}>Administrador</option></select></div><div class="field"><label>${r?'Nuevo PIN (dejar vacío para conservar)':'PIN *'}</label><input id="opPin" type="password" inputmode="numeric" ${r?'':'required'} minlength="4"></div><div class="field"><label>Estado</label><select id="opActive"><option value="1" ${r?.activo!==false?'selected':''}>Activo</option><option value="0" ${r?.activo===false?'selected':''}>Inactivo</option></select></div><div class="actions full">${r?'<button type="button" class="btn secondary" onclick="renderOperators()">Cancelar</button>':''}<button class="btn primary" type="submit">${r?'Guardar cambios':'Agregar operador'}</button></div></form><p class="sectionnote">Si un operador ya tiene cierres de caja, conviene desactivarlo en lugar de eliminarlo para conservar el historial.</p></section><section class="panel"><div class="panelhead"><div><div class="eyebrow">LISTADO</div><h3>Operadores configurados</h3></div></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Rol</th><th>Estado</th><th>Última actualización</th><th></th></tr></thead><tbody>${rows.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')).map(x=>`<tr><td><strong>${e(x.nombre)}</strong></td><td>${x.rol==='admin'?'Administrador':'Operador'}</td><td><span class="badge ${x.activo?'green':'red'}">${x.activo?'Activo':'Inactivo'}</span></td><td>${dtLabel(x.actualizado)}</td><td class="right nowrap"><button class="btn secondary small" onclick="renderOperators('${e(x.id)}')">Editar</button> <button class="btn ${x.activo?'danger':'success'} small" onclick="toggleOperator('${e(x.id)}')">${x.activo?'Desactivar':'Activar'}</button> <button class="btn danger small" onclick="deleteOperator('${e(x.id)}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay operadores.</div>'}</section>`;
  };
  function activeAdmins(rows){return rows.filter(x=>x.activo&&x.rol==='admin')}
  window.saveOperatorForm=async function(ev,id=''){
    ev.preventDefault();let rows=window.loadOperators(),old=id?rows.find(x=>String(x.id)===String(id)):null,name=document.getElementById('opName').value.trim(),role=document.getElementById('opRole').value==='admin'?'admin':'operador',active=document.getElementById('opActive').value==='1',pin=document.getElementById('opPin').value;
    if(!name)return;if(!old&&!pin){alert('Ingresá un PIN.');return}if(pin&&pin.length<4){alert('El PIN debe tener al menos 4 caracteres.');return}
    const current=session();if(old&&current&&String(old.id)===String(current.id)&&!active){alert('No podés desactivar el usuario con el que estás trabajando.');return}
    if(old&&old.rol==='admin'&&(role!=='admin'||!active)&&activeAdmins(rows).length<=1){alert('Tiene que quedar al menos un administrador activo.');return}
    const ts=now(),obj=normalizeOperator({id:id||uid('op'),nombre:name,rol:role,activo:active,pinHash:pin?await hashPin(pin):(old?.pinHash||''),creado:old?.creado||ts,actualizado:ts});
    const dup=rows.find(x=>String(x.id)!==String(obj.id)&&x.nombre.toLowerCase()===name.toLowerCase());if(dup){alert('Ya existe un operador con ese nombre.');return}
    if(old){const i=rows.findIndex(x=>String(x.id)===String(id));rows[i]=obj}else rows.push(obj);window.saveOperators(rows);queueCloudOp('upsertOperator',obj.id,obj,obj.actualizado);if(current&&String(current.id)===String(obj.id))setSession(obj);toast(old?'Operador actualizado':'Operador agregado');window.renderOperators();
  };
  window.toggleOperator=function(id){let rows=window.loadOperators(),x=rows.find(r=>String(r.id)===String(id));if(!x)return;const current=session();if(current&&String(current.id)===String(id)&&x.activo){alert('No podés desactivar el usuario con el que estás trabajando.');return}if(x.rol==='admin'&&x.activo&&activeAdmins(rows).length<=1){alert('Tiene que quedar al menos un administrador activo.');return}x.activo=!x.activo;x.actualizado=now();window.saveOperators(rows);queueCloudOp('upsertOperator',x.id,x,x.actualizado);toast(x.activo?'Operador activado':'Operador desactivado');window.renderOperators()};
  window.deleteOperator=function(id){let rows=window.loadOperators(),x=rows.find(r=>String(r.id)===String(id));if(!x)return;const current=session();if(current&&String(current.id)===String(id)){alert('No podés eliminar el usuario con el que estás trabajando.');return}if(x.rol==='admin'&&x.activo&&activeAdmins(rows).length<=1){alert('Tiene que quedar al menos un administrador activo.');return}const used=window.loadCashClosings().some(c=>String(c.operadorId||'')===String(x.id)||(!c.operadorId&&String(c.operador||'').toLowerCase()===x.nombre.toLowerCase()));if(used){alert('Este operador tiene historial de caja. No se elimina: desactivalo para conservar el registro.');return}if(!confirm('¿Eliminar definitivamente a '+x.nombre+'?'))return;window.saveOperators(rows.filter(r=>String(r.id)!==String(id)));queueCloudOp('deleteOperator',id,null,now());toast('Operador eliminado');window.renderOperators()};

  window.exportData=function(){
    const payload={app:'NQN Service',version:9,edicion:'completa-caja-operadores',exportado:now(),ordenes:load(),cleriseventos:loadEvents(),cierrescaja:window.loadCashClosings(),operadores:window.loadOperators(),settings:{lastSave:getSettings().lastSave||null}};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NQN_SERVICE_BACKUP_'+localDay()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);let s=getSettings();s.lastExternalBackup=now();setSettings(s);toast('Copia externa descargada');setTimeout(()=>window.renderBackup(),300)
  };
  window.importData=function(){
    const f=document.getElementById('importFile')?.files?.[0];if(!f){alert('Elegí un archivo de copia primero.');return}const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result),source=Array.isArray(x)?x:x.ordenes;if(!Array.isArray(source))throw new Error();if(!confirm('¿Reemplazar los datos actuales por esta copia?'))return;save(ensureClientNumbers(source.map(normalizeOrder)),'Antes de importar copia');if(Array.isArray(x.cleriseventos))saveEvents(x.cleriseventos);if(Array.isArray(x.cierrescaja))window.saveCashClosings(x.cierrescaja);if(Array.isArray(x.operadores))window.saveOperators(x.operadores);let s=getSettings();s.cloudEverSynced=false;setSettings(s);setCloudQueue([]);clearSession();toast('Copia restaurada');cloudAutoSyncSoon();renderLoginOrSetup()}catch(err){alert('El archivo no parece ser una copia válida de NQN Service.')}};reader.readAsText(f)
  };
  window.runHealthCheck=function(){
    const problems=[];if(!storageSelfTest())problems.push('El navegador no permite almacenamiento local.');const primary=readRowsKey(KEY),mirror=readRowsKey(KEY_MIRROR);if(!validRows(primary))problems.push('La copia principal de órdenes no es válida.');if(!validRows(mirror))problems.push('La copia espejo de órdenes no es válida.');if(validRows(primary)&&validRows(mirror)&&primary.length!==mirror.length)problems.push('Principal y espejo de órdenes tienen distinta cantidad.');if(loadEventsKey(KEY_EVENTS).length!==loadEventsKey(KEY_EVENTS_MIRROR).length)problems.push('Las copias de Cleris no coinciden.');if(readArray(KEY_CASH).length!==readArray(KEY_CASH_MIRROR).length)problems.push('Las copias de caja no coinciden.');if(readArray(KEY_OPERATORS).length!==readArray(KEY_OPERATORS_MIRROR).length)problems.push('Las copias de operadores no coinciden.');if(!activeAdmins(window.loadOperators()).length)problems.push('No hay administrador activo.');if(problems.length){alert('Revisión del sistema\n\n'+problems.join('\n'));return false}alert('Sistema OK.\n\nÓrdenes: '+load().length+'\nCleris: '+loadEvents().length+'\nCierres de caja: '+window.loadCashClosings().length+'\nOperadores: '+window.loadOperators().length+'\nAdministrador activo: OK');return true
  };

  window.secureBoot=async function(){
    ensureNavExtras();if(!storageSelfTest()){document.getElementById('view').innerHTML='<section class="panel"><h3>No se puede iniciar el almacenamiento local</h3><p>Esta versión necesita Microsoft Edge o Google Chrome.</p></section>';return}
    migrateIfNeeded();try{saveEvents(loadEvents())}catch(e){}migrateCashIfNeeded();try{window.saveCashClosings(window.loadCashClosings())}catch(e){}try{window.saveOperators(window.loadOperators())}catch(e){}updateNetworkStatus();
    if(cloudConfigured()&&navigator.onLine){try{await cloudSync(true)}catch(e){}}
    if(session())afterLogin();else renderLoginOrSetup();
  };

  ensureNavExtras();
  window.secureBoot();
})();

  </script>

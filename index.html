<script>
const KEY_V1='nqn_service_orders_v1';
const KEY='nqn_service_orders_v2';
const KEY_MIRROR='nqn_service_orders_v2_mirror';
const KEY_SETTINGS='nqn_service_settings_v2';
const KEY_SNAPSHOTS='nqn_service_snapshots_v2';
const KEY_EVENTS='nqn_service_cleris_events_v1';
const KEY_EVENTS_MIRROR='nqn_service_cleris_events_v1_mirror';
const ESTADOS=['En taller','Entregado'];
const SITUACIONES_TALLER=['En reparación','Esperando repuesto','Listo para entregar'];
const TIPOS=['Lavarropas','Lavavajillas','Microondas','Otro'];
const PAGOS=['Pendiente','Efectivo','Mercado Pago','Transferencia','Tarjeta crédito / débito','Mixto'];
const KEY_MODELS='nqn_service_custom_models_v1';
const KEY_CLOUD_QUEUE='nqn_service_cloud_queue_v1';
let cloudTimer=null;
let cloudSyncRunning=false;
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;updateInstallButton()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;updateInstallButton();toast('NQN Service instalada')});
function updateInstallButton(){let b=document.getElementById('installPwaBtn');if(b)b.classList.toggle('show',!!deferredInstallPrompt)}
async function installPwa(){if(!deferredInstallPrompt){alert('Si Chrome no muestra la instalación todavía, recargá la página una vez y volvé a intentar.');return}deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(e){}deferredInstallPrompt=null;updateInstallButton()}
const OFFLINE_CACHE='nqn-service-v927-caja-separada';
const OFFLINE_ASSETS=['./','./index.html','./NQN_SERVICE_ESTABLE.html','./manifest.webmanifest','./turnos.js','./icons/icon-192.png','./icons/icon-512.png'];
let swReloading=false;
async function ensureOfflineReady(){
  if(!('serviceWorker' in navigator)||!location.protocol.startsWith('http'))return false;
  try{
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      // No recargar automáticamente: una actualización del Service Worker
      // nunca debe borrar un formulario que el usuario está completando.
      // La versión nueva se aplicará al volver a abrir la app.
      if(swReloading)return;
      swReloading=true;
      try{toast('Actualización lista · se aplicará al volver a abrir la app')}catch(e){}
    });
    const reg=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
    try{await reg.update()}catch(e){}
    await navigator.serviceWorker.ready;
    // Calienta el caché explícitamente. Si la red falla, el service worker conserva lo ya cacheado.
    if('caches' in window && navigator.onLine){
      const cache=await caches.open(OFFLINE_CACHE);
      await Promise.all(OFFLINE_ASSETS.map(async u=>{
        try{const r=await fetch(u,{cache:'reload'});if(r&&r.ok)await cache.put(u,r.clone())}catch(e){}
      }));
    }
    try{localStorage.setItem('nqn_offline_ready_v8','1')}catch(e){}
    updateNetworkStatus();
    return true;
  }catch(e){console.warn('Modo offline no preparado',e);return false}
}
window.addEventListener('load',()=>ensureOfflineReady());

function cloudQueue(){
  let q=safeJSON(localStorage.getItem(KEY_CLOUD_QUEUE)||'[]',[]);
  return Array.isArray(q)?q:[];
}
function setCloudQueue(q){
  try{localStorage.setItem(KEY_CLOUD_QUEUE,JSON.stringify(Array.isArray(q)?q:[]))}catch(e){}
}

  let s=getSettings();

function queueCloudOp(type,id,data=null,at=nowISO()){
  let low=type.toLowerCase(),entity=low.includes('cash')?'cash':(low.includes('event')?'event':'order');
  let q=cloudQueue().filter(op=>!(op.entity===entity&&String(op.id)===String(id)));
  q.push({opId:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),type,entity,id:String(id),at,data});
  setCloudQueue(q);

function bootstrapCloudQueue(){
  let s=getSettings();
  if(s.cloudEverSynced)return;
  let q=cloudQueue(),seen=new Set(q.map(x=>x.entity+':'+x.id));
  load().forEach(r=>{let k='order:'+r.id;if(!seen.has(k)){q.push({opId:'boot-o-'+r.id,type:'upsertOrder',entity:'order',id:String(r.id),at:r.actualizado||r.creado||nowISO(),data:r});seen.add(k)}});
  loadEvents().forEach(e=>{let k='event:'+e.id;if(!seen.has(k)){q.push({opId:'boot-e-'+e.id,type:'upsertEvent',entity:'event',id:String(e.id),at:e.actualizado||e.creado||nowISO(),data:e});seen.add(k)}});
  if(typeof loadCashClosings==='function')loadCashClosings().forEach(c=>{let k='cash:'+c.id;if(!seen.has(k)){q.push({opId:'boot-c-'+c.id,type:'upsertCash',entity:'cash',id:String(c.id),at:c.actualizado||c.creado||nowISO(),data:c});seen.add(k)}});
  setCloudQueue(q);

function cloudAutoSyncSoon(){

}
function jsonpPull(url,token){
  return new Promise((resolve,reject)=>{
    let cb='__nqnCloudCb_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script'),done=false;
    let timer=setTimeout(()=>finish(new Error('La nube no respondió a tiempo')),12000);
    function finish(err,data){
      if(done)return;done=true;clearTimeout(timer);
      try{delete window[cb]}catch(e){window[cb]=undefined}
      script.remove();
      err?reject(err):resolve(data);
    }
    window[cb]=(data)=>finish(null,data);
    let sep=url.includes('?')?'&':'?';
    script.src=url+sep+'action=pull&token='+encodeURIComponent(token)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
    script.onerror=()=>finish(new Error('No se pudo consultar la base de Google Drive'));
    document.head.appendChild(script);
  });
}
function opReflected(op,state){
  let rows=op.entity==='order'?(state.ordenes||[]):(op.entity==='cash'?(state.cierrescaja||[]):(state.cleriseventos||[]));
  let hit=rows.find(x=>String(x.id)===String(op.id));
  if(op.type.startsWith('delete'))return !hit;
  if(!hit)return false;
  let remoteAt=new Date(hit.actualizado||hit.creado||0).getTime(),localAt=new Date(op.at||op.data?.actualizado||op.data?.creado||0).getTime();
  return !localAt||remoteAt>=localAt;
}
function applyCloudState(state,pending=[]){
  let pendingOrders=new Set(pending.filter(x=>x.entity==='order').map(x=>String(x.id)));
  let pendingEvents=new Set(pending.filter(x=>x.entity==='event').map(x=>String(x.id)));
  let pendingCash=new Set(pending.filter(x=>x.entity==='cash').map(x=>String(x.id)));
  let deletedCash=new Set(pending.filter(x=>x.entity==='cash'&&x.type==='deleteCash').map(x=>String(x.id)));
  let remoteOrders=Array.isArray(state.ordenes)?ensureClientNumbers(state.ordenes.map(normalizeOrder)):[];
  let remoteEvents=Array.isArray(state.cleriseventos)?state.cleriseventos:[];
  let remoteCash=Array.isArray(state.cierrescaja)?state.cierrescaja:[];
  if(pendingOrders.size){
    let map=new Map(remoteOrders.map(r=>[String(r.id),r]));
    load().forEach(r=>{if(pendingOrders.has(String(r.id)))map.set(String(r.id),r)});
    remoteOrders=ensureClientNumbers([...map.values()].map(normalizeOrder));
  }
  if(pendingEvents.size){
    let map=new Map(remoteEvents.map(e=>[String(e.id),e]));
    loadEvents().forEach(e=>{if(pendingEvents.has(String(e.id)))map.set(String(e.id),e)});
    remoteEvents=[...map.values()];
  }
  if(typeof loadCashClosings==='function'&&typeof saveCashClosings==='function'){
    if(deletedCash.size)remoteCash=remoteCash.filter(c=>!deletedCash.has(String(c.id)));
    if(pendingCash.size){
      let map=new Map(remoteCash.map(c=>[String(c.id),c]));
      loadCashClosings().forEach(c=>{if(pendingCash.has(String(c.id)))map.set(String(c.id),c)});
      remoteCash=[...map.values()];
    }
    saveCashClosings(remoteCash);
  }
  writeRowsKey(KEY_MIRROR,remoteOrders);writeRowsKey(KEY,remoteOrders);
  saveEvents(remoteEvents);
}
async function cloudSync(silent=false){
  if(cloudSyncRunning)return false;
  let c=cloudConfig();
  if(!c.enabled){if(!silent)alert('Activá la sincronización en Copias.');return false}
  if(!cloudConfigured()){if(!silent)alert('Pegá la URL /exec y la clave privada de sincronización.');return false}
  if(!navigator.onLine){if(!silent)toast('Sin internet: los cambios quedan pendientes');return false}

  cloudSyncRunning=true;
  try{
    bootstrapCloudQueue();
    const qStart=cloudQueue();
    const startOpIds=new Set(qStart.map(op=>String(op.opId)));

    if(qStart.length){
      await fetch(c.url,{method:'POST',mode:'no-cors',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'apply',token:c.token,device:cloudDeviceId(),ops:qStart})});
    }

    let state=await jsonpPull(c.url,c.token);
    if(!state||state.ok===false)throw new Error(state?.error||'Respuesta de nube inválida');

    const reflectedStart=new Set(qStart.filter(op=>opReflected(op,state)).map(op=>String(op.opId)));
    const latestQueue=cloudQueue();
    const remaining=latestQueue.filter(op=>{
      const id=String(op.opId);
      if(!startOpIds.has(id))return true;
      return !reflectedStart.has(id);
    });

    setCloudQueue(remaining);
    updateNetworkStatus();
    applyCloudState(state,remaining);

    let s=getSettings();
    s.cloudEverSynced=true;s.lastCloudSync=nowISO();s.lastCloudError='';
    s.cloudSheetUrl=state.meta?.spreadsheetUrl||s.cloudSheetUrl||'';
    s.cloudBackupFolderUrl=state.meta?.backupFolderUrl||s.cloudBackupFolderUrl||'';
    setSettings(s);
    if(!silent)toast(remaining.length?'Sincronización parcial: quedan cambios pendientes':'Google Drive sincronizado');
    refreshViewAfterCloudSync();
    if(remaining.length)cloudAutoSyncSoon();
    return remaining.length===0;
  }catch(e){
    let s=getSettings();s.lastCloudError=String(e?.message||e);setSettings(s);
    if(!silent)alert('No se pudo sincronizar con Google Drive.\\n\\n'+String(e?.message||e)+'\\n\\nLos datos locales siguen guardados y se reintentará después.');
    return false;
  }finally{cloudSyncRunning=false}
}
function refreshViewAfterCloudSync(){
  // La sincronización trabaja en segundo plano y NUNCA redibuja la pantalla.
  // Así ningún formulario se borra mientras el usuario está escribiendo.
  updateNetworkStatus();
}

function updateNetworkStatus(){
  const el=document.getElementById('netStatus');if(!el)return;
  const pending=cloudQueue().length;
  if(!navigator.onLine){el.className='netstatus offline';el.innerHTML='<span class="netdot"></span><span>Sin conexión · guardado local</span>';return}
  if(pending){el.className='netstatus pending';el.innerHTML='<span class="netdot"></span><span>En línea · '+pending+' pendiente'+(pending===1?'':'s')+'</span>';return}
  el.className='netstatus online';el.innerHTML='<span class="netdot"></span><span>En línea</span>';
}
function cloudStatus(){
  let c=cloudConfig(),pending=cloudQueue().length;
  if(!c.enabled)return {cls:'',label:'Nube desactivada',detail:'Los datos se guardan solo en este dispositivo.',pending};
  if(!cloudConfigured())return {cls:'amber',label:'Falta configurar Drive',detail:'Pegá la URL del Web App y la clave privada.',pending};
  if(!navigator.onLine)return {cls:'amber',label:'Sin conexión',detail:pending?pending+' cambio(s) pendientes para subir.':'Se sincronizará cuando vuelva internet.',pending};
  if(c.lastError)return {cls:'red',label:'Error de sincronización',detail:c.lastError,pending};
  if(pending)return {cls:'amber',label:'Cambios pendientes',detail:pending+' cambio(s) esperando sincronización.',pending};
  if(c.lastSync)return {cls:'green',label:'Drive sincronizado',detail:'Última sincronización '+prettyDateTime(c.lastSync)+'.',pending};
  return {cls:'amber',label:'Listo para sincronizar',detail:'Todavía no se hizo la primera sincronización.',pending};
}
function saveCloudConfig(){
  let url=(document.getElementById('cloudUrl')?.value||'').trim(),token=(document.getElementById('cloudToken')?.value||'').trim(),enabled=!!document.getElementById('cloudEnabled')?.checked;
  if(enabled&&url&&!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/i.test(url)){alert('La URL debe terminar en /exec y ser la del Web App de Google Apps Script.');return}if(enabled&&!token){alert('Falta la clave privada de sincronización.');return}
  let s=getSettings(),changed=(s.cloudUrl&&s.cloudUrl!==url)||(s.cloudToken&&s.cloudToken!==token);
  s.cloudUrl=url;s.cloudToken=token;s.cloudEnabled=enabled;
  if(changed){s.cloudEverSynced=false;s.lastCloudSync='';setCloudQueue([])}
  setSettings(s);toast('Configuración de nube guardada');renderBackup();if(enabled&&url)cloudSync(false);
}
function disableCloud(){

function parseMoneyAR(value){
  let s=String(value??'').trim().replace(/\s/g,'').replace(/\$/g,'');
  if(!s)return 0;
  const hasComma=s.includes(','),dots=(s.match(/\./g)||[]).length;
  if(hasComma){s=s.replace(/\./g,'').replace(',','.');}
  else if(dots>1){s=s.replace(/\./g,'');}
  else if(dots===1){const parts=s.split('.');if(parts[1]&&parts[1].length===3)s=parts.join('');}

function whatsappNumber(phone){
  let p=normPhone(phone);
  if(!p)return '';
  if(p.startsWith('0054'))p=p.slice(4);
  if(p.startsWith('54'))p=p.slice(2);
  if(p.startsWith('0'))p=p.slice(1);
  // Formato habitual de Neuquén: 299 + número. Si alguien cargó 15, lo quitamos.
  if(p.startsWith('29915'))p='299'+p.slice(5);
  // WhatsApp para celulares argentinos: 54 + 9 + código de área + número.
  return p.startsWith('9')?'54'+p:'549'+p;
}

function ensureClientNumbers(rows){
  let phoneMap=new Map(),next=1001;
  rows.forEach(r=>{if(r.clienteNumero>=next)next=r.clienteNumero+1});
  rows.sort((a,b)=>(a.numero||0)-(b.numero||0)).forEach(r=>{
    let p=normPhone(r.telefono),key=p||('name:'+r.cliente.toLowerCase().trim());
    if(phoneMap.has(key))r.clienteNumero=phoneMap.get(key);
    else{if(!r.clienteNumero)r.clienteNumero=next++;phoneMap.set(key,r.clienteNumero)}
  });
  return rows;
}
function storageSelfTest(){
  const k='nqn_service_test_'+Date.now();
  try{localStorage.setItem(k,'ok');let ok=localStorage.getItem(k)==='ok';localStorage.removeItem(k);return ok}catch(e){return false}
}
function validRows(x){return Array.isArray(x)&&x.every(r=>r&&typeof r==='object')}
function readRowsKey(key){
  let x=safeJSON(localStorage.getItem(key)||'null',null);
  if(validRows(x))return x;
  if(x&&typeof x==='object'&&validRows(x.rows))return x.rows;
  return null;
}
function writeRowsKey(key,rows){localStorage.setItem(key,JSON.stringify({schema:3,guardado:nowISO(),rows}))}
function migrateIfNeeded(){
  let current=readRowsKey(KEY);
  if(validRows(current)){let normalized=ensureClientNumbers(current.map(normalizeOrder));writeRowsKey(KEY,normalized);try{writeRowsKey(KEY_MIRROR,normalized)}catch(e){};return}
  let mirror=readRowsKey(KEY_MIRROR);
  if(validRows(mirror)){let normalized=ensureClientNumbers(mirror.map(normalizeOrder));writeRowsKey(KEY,normalized);writeRowsKey(KEY_MIRROR,normalized);return}
  let old=safeJSON(localStorage.getItem(KEY_V1)||'[]',[]);
  let rows=ensureClientNumbers((Array.isArray(old)?old:[]).map(normalizeOrder));
  writeRowsKey(KEY,rows);writeRowsKey(KEY_MIRROR,rows);
  if(rows.length){writeSnapshot(rows,'Migración desde versión anterior');toast('Datos anteriores recuperados')}
}
function load(){
  let rows=readRowsKey(KEY);
  if(validRows(rows))return rows;
  let mirror=readRowsKey(KEY_MIRROR);
  if(validRows(mirror)){try{writeRowsKey(KEY,mirror)}catch(e){};return mirror}
  return [];
}
function save(rows,reason='Guardado automático'){
  rows=Array.isArray(rows)?rows:[];
  let previous=load();
  if(previous.length)writeSnapshot(previous,reason);
  try{
    writeRowsKey(KEY_MIRROR,rows);
    writeRowsKey(KEY,rows);
    let verify=readRowsKey(KEY);
    if(!validRows(verify)||verify.length!==rows.length)throw new Error('No se pudo verificar el guardado');
    let st=getSettings();st.lastSave=nowISO();setSettings(st);
  }catch(e){
    alert('No se pudieron guardar los datos. No cierres la aplicación. Descargá una copia desde Copias. Detalle: '+e.message);
    throw e;
  }
}
function nextOrder(){let rows=load();return rows.length?Math.max(...rows.map(r=>Number(r.numero)||0))+1:1}
function nextClient(){let rows=load();return rows.length?Math.max(1000,...rows.map(r=>Number(r.clienteNumero)||0))+1:1001}
function daysBetween(start,end=localISODate()){
  if(!start)return 0;let a=new Date(start+'T12:00:00'),b=new Date(end+'T12:00:00');return Math.max(0,Math.floor((b-a)/86400000));
}

function prepareStockUsageFromForm(ts){
  const stockId=String(document.getElementById('stockUsedId')?.value||'').trim();
  if(!stockId)return {ok:true,usage:null,stockNext:null};
  const qty=Math.max(1,Math.floor(Number(document.getElementById('stockUsedQty')?.value||1)));
  if(typeof window.loadStock!=='function'||typeof window.saveStock!=='function'){
    alert('No pude acceder al stock. La OT no se guardó para evitar descontar mal.');
    return {ok:false};
  }
  const stock=window.loadStock(),i=stock.findIndex(x=>String(x.id)===stockId);
  if(i<0){alert('Ese repuesto ya no existe en Stock. Elegí otro.');return {ok:false}}
  const item=stock[i],available=Math.max(0,Number(item.cantidad||0));
  if(available<qty){alert('Stock insuficiente de '+item.nombre+'. Disponible: '+available+'.');return {ok:false}}
  const usage={id:'rep-'+Date.now()+'-'+Math.random().toString(36).slice(2),stockId:String(item.id),nombre:String(item.nombre||''),cantidad:qty,costoUnitario:Math.max(0,Number(item.costo||0)),fecha:localISODate(),creado:ts};
  stock[i]={...item,cantidad:available-qty,actualizado:ts};
  return {ok:true,usage,stockNext:stock};
}

function returnStockUsage(orderId,usageId){
  let rows=load(),oi=rows.findIndex(r=>String(r.id)===String(orderId));if(oi<0)return;
  let order=rows[oi],usages=Array.isArray(order.repuestosUsados)?[...order.repuestosUsados]:[],ui=usages.findIndex(x=>String(x.id)===String(usageId));if(ui<0)return;
  const usage=usages[ui];
  if(!confirm('¿Quitar '+usage.nombre+' de la OT y devolver '+Number(usage.cantidad||1)+' al stock?'))return;
  let stock=typeof window.loadStock==='function'?window.loadStock():[],si=stock.findIndex(x=>String(x.id)===String(usage.stockId||''));
  if(si<0){alert('No encontré ese repuesto en Stock. No hice ningún cambio.');return}
  const ts=nowISO();
  stock[si]={...stock[si],cantidad:Number(stock[si].cantidad||0)+Math.max(1,Number(usage.cantidad||1)),actualizado:ts};
  usages.splice(ui,1);order.repuestosUsados=usages;order.actualizado=ts;rows[oi]=order;
  save(rows,'Devolución de repuesto de OT '+fmtOrder(order.numero));
  window.saveStock(stock);
  queueCloudOp('upsertOrder',order.id,order,order.actualizado);
  toast('Repuesto devuelto al stock');
  editOrder(order.id);
}

function mixedPaymentSplit(targetAmount){
  const efectivo=Math.max(0,parseMoneyAR(document.getElementById('mixtoEfectivo')?.value)||0);
  const tarjeta=Math.max(0,parseMoneyAR(document.getElementById('mixtoTarjeta')?.value)||0);
  if(efectivo<=0||tarjeta<=0){alert('En pago mixto cargá un importe mayor a cero en Efectivo y en Tarjeta.');return null}
  if(Math.abs((efectivo+tarjeta)-Number(targetAmount||0))>0.009){alert('El detalle mixto no coincide. Efectivo + Tarjeta debe sumar '+money(targetAmount)+'.');return null}
  return {efectivo,tarjeta};
}
function collectBalance(orderId){

  let old=rows[i];
  const medioPago=document.getElementById('medioPago')?.value||'Pendiente';
  const fechaPago=document.getElementById('fechaPago')?.value||localISODate();
  const montoForm=Math.max(0,parseMoneyAR(document.getElementById('monto')?.value)||0);
  const nuevaEntrega=Math.max(0,parseMoneyAR(document.getElementById('pagado')?.value)||0);
  if(Math.abs(montoForm-Number(old.monto||0))>0.009||nuevaEntrega>0){alert('Primero guardá los cambios o la seña / entrega. Después usá “Cobrar saldo”.');return}
  if(medioPago==='Pendiente'){alert('Elegí el medio de pago antes de cobrar el saldo.');return}
  const saldo=Math.max(0,Number(old.monto||0)-Number(old.pagado||0));
  if(saldo<=0){alert('Esta orden no tiene saldo pendiente.');editOrder(old.id);return}
  const split=medioPago==='Mixto'?mixedPaymentSplit(saldo):null;
  if(medioPago==='Mixto'&&!split)return;
  const detalle=split?' (Efectivo '+money(split.efectivo)+' + Tarjeta '+money(split.tarjeta)+')':'';
  if(!confirm('¿Cobrar '+money(saldo)+' por '+medioPago+detalle+' y dejar el saldo en cero?'))return;
  const now=nowISO();
  let obj={...old};
  obj.pagos=Array.isArray(old.pagos)?[...old.pagos]:[];
  // Compatibilidad con órdenes antiguas que tenían un total recibido pero no historial detallado.
  const legacyPagado=obj.pagos.length?0:Math.max(0,Number(old.pagado||0));
  const pago={id:'pago-'+Date.now()+'-'+Math.random().toString(36).slice(2),fecha:fechaPago,monto:saldo,medioPago,creado:now};
  if(split){pago.efectivo=split.efectivo;pago.tarjeta=split.tarjeta}
  obj.pagos.push(pago);
  obj.pagado=legacyPagado+obj.pagos.reduce((a,p)=>a+Number(p.monto||0),0);
  obj.medioPago=medioPago;
  obj.actualizado=now;
  rows[i]=obj;
  save(rows,'Antes de cobrar saldo OT '+fmtOrder(obj.numero));
  queueCloudOp('upsertOrder',obj.id,obj,obj.actualizado);
  toast('Saldo cobrado · '+money(saldo)+' · '+medioPago);
  editOrder(obj.id);
}

function submitOrder(ev,isNew){
  ev.preventDefault();
  let rows=load(),now=nowISO(),fechaEntrega=isNew?'':(document.getElementById('fechaEntrega')?.value||'');
  const nuevaEntrega=Math.max(0,parseMoneyAR(document.getElementById('pagado')?.value)||0);
  const fechaPago=document.getElementById('fechaPago')?.value||localISODate();
  const medioPago=document.getElementById('medioPago')?.value||'Pendiente';
  let splitEntrega=null;
  if(nuevaEntrega>0&&medioPago==='Mixto'){splitEntrega=mixedPaymentSplit(nuevaEntrega);if(!splitEntrega)return}
  let obj={
    fechaIngreso:document.getElementById('fechaIngreso').value,fechaEntrega,
    cliente:document.getElementById('cliente').value.trim(),telefono:document.getElementById('telefono').value.trim(),
    marcaModelo:collectBrandModel(),tipo:document.getElementById('tipo').value,falla:document.getElementById('falla').value.trim(),
    accesorios:document.getElementById('accesorios').value.trim(),observaciones:document.getElementById('observaciones').value.trim(),
    estado:fechaEntrega?'Entregado':'En taller',situacionTaller:document.getElementById('situacionTaller')?.value||'En reparación',monto:Math.max(0,parseMoneyAR(document.getElementById('monto').value)||0),
    pagado:0,medioPago,actualizado:now,pagos:[],repuestosUsados:[]
  };
  if(!obj.marcaModelo){alert('Elegí la marca y el modelo. Si no aparecen en la lista, usá “Otra marca” / “Otro modelo”.');return}
  if(nuevaEntrega>0&&medioPago==='Pendiente'){alert('Elegí el medio de pago para registrar la seña / entrega en caja.');return}
  if(isNew){
    obj.id=(crypto.randomUUID?crypto.randomUUID():Date.now().toString());obj.numero=nextOrder();obj.clienteNumero=findClientNumber(obj.telefono,obj.cliente);obj.creado=now;
    obj.fechasEstado={'En taller':now};obj.historial=[{fecha:now,estado:'En taller'}];
    if(nuevaEntrega>0){const pago={id:'pago-'+Date.now()+'-'+Math.random().toString(36).slice(2),fecha:fechaPago,monto:nuevaEntrega,medioPago,creado:now};if(splitEntrega){pago.efectivo=splitEntrega.efectivo;pago.tarjeta=splitEntrega.tarjeta}obj.pagos.push(pago)}
    obj.pagado=obj.pagos.reduce((a,p)=>a+Number(p.monto||0),0);
    if(obj.pagado>obj.monto&&obj.monto>0&&!confirm('La seña / entrega supera el monto total. ¿Guardar igual?'))return;
    const stockChange=prepareStockUsageFromForm(now);if(!stockChange.ok)return;
    if(stockChange.usage)obj.repuestosUsados.push(stockChange.usage);
    rows.push(obj);save(rows,'Antes de crear orden');
    if(stockChange.stockNext)window.saveStock(stockChange.stockNext);
    queueCloudOp('upsertOrder',obj.id,obj,obj.actualizado||obj.creado);toast(stockChange.usage?'Orden '+fmtOrder(obj.numero)+' guardada · stock descontado':'Orden '+fmtOrder(obj.numero)+' guardada');editOrder(obj.id);
  }else{
    let i=rows.findIndex(r=>r.id===editingId);if(i<0)return;let old=rows[i];
    obj.id=old.id;obj.numero=old.numero;obj.clienteNumero=findClientNumber(obj.telefono,obj.cliente)||old.clienteNumero;obj.creado=old.creado;obj.fechasEstado={...(old.fechasEstado||{})};obj.historial=[...(old.historial||[])];obj.pagos=Array.isArray(old.pagos)?[...old.pagos]:[];obj.repuestosUsados=Array.isArray(old.repuestosUsados)?[...old.repuestosUsados]:[];
    // Compatibilidad: si una orden vieja tenía pagado pero todavía no tenía historial de pagos,
    // no inventamos una fecha. Ese importe sigue formando parte del total recibido.
    const legacyPagado=obj.pagos.length?0:Math.max(0,Number(old.pagado||0));
    let medioCorregido=false;
    if(nuevaEntrega>0){
      const pago={id:'pago-'+Date.now()+'-'+Math.random().toString(36).slice(2),fecha:fechaPago,monto:nuevaEntrega,medioPago,creado:now};
      if(splitEntrega){pago.efectivo=splitEntrega.efectivo;pago.tarjeta=splitEntrega.tarjeta}
      obj.pagos.push(pago);
    }else if(obj.pagos.length&&medioPago!=='Pendiente'&&String(medioPago)!==String(old.medioPago||'Pendiente')){
      // Corrección de un medio cargado por error: cambia el último cobro existente,
      // no crea un movimiento nuevo y por eso no duplica la caja.
      const idx=obj.pagos.length-1,last={...obj.pagos[idx]};
      if(medioPago==='Mixto'){
        const split=mixedPaymentSplit(Number(last.monto||0));if(!split)return;
        last.medioPago='Mixto';last.efectivo=split.efectivo;last.tarjeta=split.tarjeta;last.actualizado=now;
      }else{
        last.medioPago=medioPago;delete last.efectivo;delete last.tarjeta;last.actualizado=now;
      }
      obj.pagos[idx]=last;
      medioCorregido=true;
    }
    obj.pagado=legacyPagado+obj.pagos.reduce((a,p)=>a+Number(p.monto||0),0);
    if(obj.pagado>obj.monto&&obj.monto>0&&!confirm('El total recibido supera el monto total. ¿Guardar igual?'))return;
    const stockChange=prepareStockUsageFromForm(now);if(!stockChange.ok)return;
    if(stockChange.usage)obj.repuestosUsados.push(stockChange.usage);
    if(obj.estado!==old.estado){obj.fechasEstado[obj.estado]=now;obj.historial.push({fecha:now,estado:obj.estado})}
    rows[i]=obj;save(rows,'Antes de editar orden '+fmtOrder(obj.numero));
    if(stockChange.stockNext)window.saveStock(stockChange.stockNext);
    queueCloudOp('upsertOrder',obj.id,obj,obj.actualizado);toast(stockChange.usage?'Orden actualizada · stock descontado':(nuevaEntrega>0?'Seña / entrega registrada en caja':(medioCorregido?'Medio de pago corregido · caja actualizada':(obj.estado==='Entregado'?'Orden cerrada como entregada':'Orden actualizada'))));editOrder(obj.id);
  }
}

function deleteOrder(id){
  let all=load(),order=all.find(r=>String(r.id)===String(id));
  if(!order)return;
  const usages=Array.isArray(order.repuestosUsados)?order.repuestosUsados.filter(x=>Number(x?.cantidad||0)>0):[];
  const units=usages.reduce((a,x)=>a+Math.max(1,Number(x.cantidad||1)),0);
  const extra=units?('\n\nSe devolverán automáticamente '+units+' unidad'+(units===1?'':'es')+' de repuestos al stock.') : '';
  if(!confirm('¿Eliminar esta orden? Se guardará una copia automática anterior, pero conviene evitar eliminar si solo querés cambiar el estado.'+extra))return;

  let stock=null;
  if(usages.length){
    if(typeof window.loadStock!=='function'||typeof window.saveStock!=='function'){
      alert('No pude acceder al stock. La OT no se eliminó para evitar perder los repuestos usados.');
      return;
    }
    stock=window.loadStock();
    const ts=nowISO();
    usages.forEach(usage=>{
      const qty=Math.max(1,Number(usage.cantidad||1));
      const sid=String(usage.stockId||'').trim();
      let i=sid?stock.findIndex(x=>String(x.id)===sid):-1;
      if(i>=0){
        stock[i]={...stock[i],cantidad:Number(stock[i].cantidad||0)+qty,actualizado:ts};
      }else{
        stock.push({
          id:sid||('stock-rest-'+Date.now()+'-'+Math.random().toString(36).slice(2)),
          nombre:String(usage.nombre||'Repuesto devuelto'),
          cantidad:qty,
          minimo:2,
          costo:Math.max(0,Number(usage.costoUnitario||0)),
          creado:ts,
          actualizado:ts
        });
      }
    });
  }

  let rows=all.filter(r=>String(r.id)!==String(id));
  save(rows,'Antes de eliminar orden');
  if(stock)window.saveStock(stock);
  queueCloudOp('deleteOrder',id,null,nowISO());
  toast(units?'Orden eliminada · repuestos devueltos al stock':'Orden eliminada');
  renderOrders();
}

function receiptWrapLines(ctx,text,maxWidth){
  const clean=String(text??'').trim()||'-',out=[];
  clean.split(/\n+/).forEach(paragraph=>{
    const words=paragraph.split(/\s+/).filter(Boolean);let line='';
    words.forEach(word=>{
      const test=line?line+' '+word:word;
      if(line&&ctx.measureText(test).width>maxWidth){out.push(line);line=word}else line=test;
    });
    if(line)out.push(line);
  });
  return out.length?out:['-'];
}

    return;

  migrateIfNeeded();
  let ev=loadEvents();try{saveEvents(ev)}catch(e){}
  renderDashboard();

}

  <script>
/* NQN Service V9.31 Completa
   Caja diaria + operadores + PIN + roles + sincronización con Drive.
   No guarda PIN en texto plano: almacena un hash.
*/
(() => {
  const KEY_CASH = 'nqn_service_cash_closings_v2';
  const KEY_CASH_MIRROR = 'nqn_service_cash_closings_v2_mirror';
  const KEY_CASH_OLD = 'nqn_service_cash_closings_v1';
  const KEY_CASH_OLD_MIRROR = 'nqn_service_cash_closings_v1_mirror';
  const CASH_CUT_MARKER = '[CORTE_CAJA_NQN]';
  const KEY_OPERATORS = 'nqn_service_operators_v1';
  const KEY_OPERATORS_MIRROR = 'nqn_service_operators_v1_mirror';
  const KEY_SESSION = 'nqn_service_operator_session_v1';
  const KEY_EXPENSES = 'nqn_service_expenses_v1';
  const KEY_EXPENSES_MIRROR = 'nqn_service_expenses_v1_mirror';
  const KEY_STOCK = 'nqn_service_stock_v1';
  const KEY_STOCK_MIRROR = 'nqn_service_stock_v1_mirror';
  const KEY_LAST_ACTIVE_DAY = 'nqn_service_last_active_day_v1';
  const KEY_REQUIRED_CLOSE_DAY = 'nqn_service_required_close_day_v1';
  const EXPENSE_CATEGORIES = ['Combustible','Repuestos','Herramientas','Alquiler','Luz','Gas','Otro'];
  const EXPENSE_CATEGORIES_VALID = [...EXPENSE_CATEGORIES,'Servicios']; // compatibilidad histórica
  const EXPENSE_PAYMENTS = ['Efectivo','Mercado Pago'];
  const ADMIN_VIEWS = new Set(['dashboard','kpis','cleris','backup','operadores']);

  const coreShowView = window.showView;
  const coreRenderDashboard = window.renderDashboard;
  const coreRenderKPIs = window.renderKPIs;
  const coreRenderCleris = window.renderCleris;
  const coreRenderBackup = window.renderBackup;
  const coreNewOrder = window.newOrder;

  function parseJSON(text, fallback){ try{return JSON.parse(text)}catch(e){return fallback} }
  function readArray(key){ const x=parseJSON(localStorage.getItem(key)||'[]',[]); return Array.isArray(x)?x:[]; }
  function localDay(){ return typeof localISODate==='function'?localISODate():new Date().toISOString().slice(0,10); }
  function now(){ return typeof nowISO==='function'?nowISO():new Date().toISOString(); }
  function e(v){ return typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
  function m(v){ return typeof money==='function'?money(v):'$'+Number(v||0).toLocaleString('es-AR',{maximumFractionDigits:0}); }
  function dateLabel(v){ return typeof prettyDate==='function'?prettyDate(v):v||'-'; }
  function dtLabel(v){ return typeof prettyDateTime==='function'?prettyDateTime(v):v||'-'; }
  function uid(prefix){ return (crypto.randomUUID?crypto.randomUUID():prefix+'-'+Date.now()+'-'+Math.random().toString(36).slice(2)); }

  function legacyPinHash(pin){
    const raw='NQN_SERVICE_PIN|'+String(pin||'');
    let h=2166136261;
    for(let i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=Math.imul(h,16777619)}
    return 'fnv1a-'+(h>>>0).toString(16);
  }
  async function hashPin(pin){
    const raw='NQN_SERVICE_PIN|'+String(pin||'');
    if(window.crypto&&crypto.subtle&&window.TextEncoder){
      try{
        const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));
        return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
      }catch(e){}
    }
    return legacyPinHash(pin);
  }

  function normalizeOperator(r,index=0){
    return {
      id:String(r?.id||('op-'+Date.now()+'-'+index)),
      nombre:String(r?.nombre||r?.name||'').trim(),
      rol:String(r?.rol||'operador').toLowerCase()==='admin'?'admin':'operador',
      activo:r?.activo!==false,
      pinHash:String(r?.pinHash||''),
      creado:r?.creado||now(),
      actualizado:r?.actualizado||r?.creado||now()
    };
  }
  window.normalizeOperator=normalizeOperator;
  window.loadOperators=function(){
    let a=readArray(KEY_OPERATORS),b=readArray(KEY_OPERATORS_MIRROR);
    const src=a.length?a:b;
    if(!a.length&&b.length){try{localStorage.setItem(KEY_OPERATORS,JSON.stringify(b))}catch(e){}}
    return src.map(normalizeOperator).filter(x=>x.nombre);
  };
  window.saveOperators=function(rows){
    rows=(Array.isArray(rows)?rows:[]).map(normalizeOperator).filter(x=>x.nombre);
    localStorage.setItem(KEY_OPERATORS_MIRROR,JSON.stringify(rows));
    localStorage.setItem(KEY_OPERATORS,JSON.stringify(rows));
    if(readArray(KEY_OPERATORS).length!==rows.length)throw new Error('No se pudo verificar el guardado de operadores');
    return rows;
  };

  function migrateCashIfNeeded(){
    if(readArray(KEY_CASH).length||readArray(KEY_CASH_MIRROR).length)return;
    const old=readArray(KEY_CASH_OLD).length?readArray(KEY_CASH_OLD):readArray(KEY_CASH_OLD_MIRROR);
    if(old.length)try{window.saveCashClosings(old)}catch(e){}
  }
  function normalizeCashClosing(r,index=0){
    return {
      id:String(r?.id||('caja-'+Date.now()+'-'+index)),fecha:String(r?.fecha||localDay()),
      operadorId:String(r?.operadorId||''),operador:String(r?.operador||'').trim(),
      efectivo:Math.max(0,Number(r?.efectivo||0)),mercadoPago:Math.max(0,Number(r?.mercadoPago||0)),
      tarjetas:Math.max(0,Number(r?.tarjetas||0)),notaCredito:Math.max(0,Number(r?.notaCredito||0)),
      gastos:Math.max(0,Number(r?.gastos||0)),observaciones:String(r?.observaciones||'').trim(),
      creado:r?.creado||now(),actualizado:r?.actualizado||r?.creado||now()
    };
  }
  window.normalizeCashClosing=normalizeCashClosing;
  window.loadCashClosings=function(){
    let a=readArray(KEY_CASH),b=readArray(KEY_CASH_MIRROR),src=a.length?a:b;
    if(!a.length&&b.length){try{localStorage.setItem(KEY_CASH,JSON.stringify(b))}catch(e){}}
    return src.map(normalizeCashClosing);
  };
  window.saveCashClosings=function(rows){
    rows=(Array.isArray(rows)?rows:[]).map(normalizeCashClosing);
    localStorage.setItem(KEY_CASH_MIRROR,JSON.stringify(rows));localStorage.setItem(KEY_CASH,JSON.stringify(rows));
    if(readArray(KEY_CASH).length!==rows.length)throw new Error('No se pudo verificar el guardado de caja');
    return rows;
  };
  function cashTotals(r){const ingresos=Number(r.efectivo||0)+Number(r.mercadoPago||0)+Number(r.tarjetas||0);return {ingresos,neto:ingresos-Number(r.notaCredito||0)-Number(r.gastos||0)}}
  function cashFromOrders(fecha){
    const out={efectivo:0,mercadoPago:0,tarjetas:0,mixto:0,cantidad:0};
    const rows=(typeof load==='function'?load():[]);
    rows.forEach(r=>{
      if(!r)return;
      const pagos=Array.isArray(r.pagos)?r.pagos:[];
      if(pagos.length){
        pagos.forEach(p=>{
          if(String(p.fecha||'')!==String(fecha||''))return;
          const monto=Number(p.monto||0);if(!monto)return;
          const medio=String(p.medioPago||'').trim();
          if(medio==='Efectivo')out.efectivo+=monto;
          else if(medio==='Mercado Pago'||medio==='Transferencia')out.mercadoPago+=monto;
          else if(medio==='Tarjeta'||medio==='Tarjeta crédito / débito'||medio==='Tarjeta crédito/débito')out.tarjetas+=monto;
          else if(medio==='Mixto'){
            const ef=Math.max(0,Number(p.efectivo||0)),ta=Math.max(0,Number(p.tarjeta||0));
            if(ef>0||ta>0){out.efectivo+=ef;out.tarjetas+=ta}else out.mixto+=monto;
          }
          else return;
          out.cantidad++;
        });
        return;
      }
      // Compatibilidad con órdenes anteriores a V9.11: conserva el criterio histórico.
      if(r.estado!=='Entregado'||String(r.fechaEntrega||'')!==String(fecha||''))return;
      const monto=Math.max(0,Number(r.pagado||0));if(!monto)return;
      const medio=String(r.medioPago||'').trim();
      if(medio==='Efectivo')out.efectivo+=monto;
      else if(medio==='Mercado Pago'||medio==='Transferencia')out.mercadoPago+=monto;
      else if(medio==='Tarjeta'||medio==='Tarjeta crédito / débito'||medio==='Tarjeta crédito/débito')out.tarjetas+=monto;
      else if(medio==='Mixto')out.mixto+=monto;
      else return;
      out.cantidad++;
    });
    return out;
  }

  function cashFromCleris(fecha){
    const out={efectivo:0,mercadoPago:0,tarjetas:0,mixto:0,cantidad:0,total:0};
    const events=(typeof loadEvents==='function'?loadEvents():[]);
    events.forEach(ev=>{
      if(!ev||String(ev.fecha||'')!==String(fecha||''))return;
      const monto=Math.max(0,Number(ev.monto||0));if(!monto)return;
      const medio=String(ev.medioPago||'').trim();
      if(medio==='Efectivo')out.efectivo+=monto;
      else if(medio==='Mercado Pago'||medio==='Transferencia')out.mercadoPago+=monto;
      else if(medio==='Tarjeta'||medio==='Tarjeta crédito / débito'||medio==='Tarjeta crédito/débito')out.tarjetas+=monto;
      else if(medio==='Mixto')out.mixto+=monto;
      else return;
      out.total+=monto;
      out.cantidad++;
    });
    return out;
  }

  function normalizeExpense(r,index=0){
    return {
      id:String(r?.id||('gasto-'+Date.now()+'-'+index)),fecha:String(r?.fecha||localDay()),
      operadorId:String(r?.operadorId||''),operador:String(r?.operador||'').trim(),
      monto:Math.max(0,Number(r?.monto||0)),medioPago:EXPENSE_PAYMENTS.includes(String(r?.medioPago||''))?String(r.medioPago):'Efectivo',
      categoria:EXPENSE_CATEGORIES_VALID.includes(String(r?.categoria||''))?String(r.categoria):'Otro',
      observacion:String(r?.observacion||'').trim(),cajaId:String(r?.cajaId||''),
      orderId:String(r?.orderId||''),orderNumero:Number(r?.orderNumero||0),orderCliente:String(r?.orderCliente||'').trim(),orderEquipo:String(r?.orderEquipo||'').trim(),
      creado:r?.creado||now(),actualizado:r?.actualizado||r?.creado||now()
    };
  }
  window.loadExpenses=function(){
    let a=readArray(KEY_EXPENSES),b=readArray(KEY_EXPENSES_MIRROR),src=a.length?a:b;
    if(!a.length&&b.length){try{localStorage.setItem(KEY_EXPENSES,JSON.stringify(b))}catch(e){}}
    return src.map(normalizeExpense);
  };
  window.saveExpenses=function(rows){
    rows=(Array.isArray(rows)?rows:[]).map(normalizeExpense);
    localStorage.setItem(KEY_EXPENSES_MIRROR,JSON.stringify(rows));localStorage.setItem(KEY_EXPENSES,JSON.stringify(rows));
    if(readArray(KEY_EXPENSES).length!==rows.length)throw new Error('No se pudo verificar el guardado de gastos');
    return rows;
  };
  function operatorOwns(x,op){return String(x?.operadorId||'')===String(op?.id||'')||(!x?.operadorId&&String(x?.operador||'').toLowerCase()===String(op?.nombre||'').toLowerCase())}
  function todaysCashForOperator(rows,op,fecha=localDay()){return rows.find(x=>x.fecha===fecha&&operatorOwns(x,op))||null}
  function expenseTotalFor(fecha,owner){
    const rows=(window.loadExpenses?window.loadExpenses():[]).filter(x=>x.fecha===fecha&&operatorOwns(x,owner));
    return rows.reduce((a,x)=>a+Number(x.monto||0),0);
  }

  function session(){
    const s=parseJSON(sessionStorage.getItem(KEY_SESSION)||'null',null);if(!s||!s.id)return null;
    const op=window.loadOperators().find(x=>String(x.id)===String(s.id)&&x.activo);return op||null;
  }
  window.currentOperator=session;
  window.isAdmin=function(){const op=session();return !!op&&op.rol==='admin'};
  function setSession(op){sessionStorage.setItem(KEY_SESSION,JSON.stringify({id:op.id,at:now()}));updateAuthBar();applyRoleNav()}
  function clearSession(){sessionStorage.removeItem(KEY_SESSION);updateAuthBar();applyRoleNav()}

  function isCashCut(x){return String(x?.observaciones||'').includes(CASH_CUT_MARKER)}
  function latestCashCut(){
    const cuts=(window.loadCashClosings?window.loadCashClosings():[]).filter(isCashCut);
    if(!cuts.length)return null;
    return [...cuts].sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||''))||String(b.actualizado||'').localeCompare(String(a.actualizado||'')))[0];
  }
  function hasCashClosing(fecha){
    return !!fecha&&(window.loadCashClosings?window.loadCashClosings():[]).some(x=>!isCashCut(x)&&String(x.fecha||'')===String(fecha));
  }
  function requiredCloseDay(){
    const today=localDay();
    let required=String(localStorage.getItem(KEY_REQUIRED_CLOSE_DAY)||'');
    if(required){
      if(hasCashClosing(required)||required>=today){localStorage.removeItem(KEY_REQUIRED_CLOSE_DAY);required=''}
      else return required;
    }
    const last=String(localStorage.getItem(KEY_LAST_ACTIVE_DAY)||'');
    if(last&&last<today&&!hasCashClosing(last)){
      localStorage.setItem(KEY_REQUIRED_CLOSE_DAY,last);
      return last;
    }
    return '';
  }
  function markTodayActive(){try{localStorage.setItem(KEY_LAST_ACTIVE_DAY,localDay())}catch(e){}}
  function blockForRequiredClose(showMessage=true){
    const pending=requiredCloseDay();
    if(!pending){markTodayActive();return false}
    if(showMessage)toast('Cierre de caja pendiente del '+dateLabel(pending)+' · cerralo para continuar');
    window.showCashSummary('',pending,true);
    return true;
  }
  function clearRequiredCloseIfSatisfied(fecha){
    const required=String(localStorage.getItem(KEY_REQUIRED_CLOSE_DAY)||'');
    if(required&&String(fecha)===required&&hasCashClosing(required))localStorage.removeItem(KEY_REQUIRED_CLOSE_DAY);
    markTodayActive();
  }

  function ensureNavExtras(){
    const nav=document.querySelector('.nav');if(!nav)return;
    if(!document.getElementById('nav-stock')){
      const b=document.createElement('button');b.id='nav-stock';b.innerHTML='▤ Stock';b.onclick=()=>window.showView('stock');
      const k=document.getElementById('nav-kpis');k?nav.insertBefore(b,k):nav.appendChild(b);
    }
    if(!document.getElementById('nav-gastos')){
      const b=document.createElement('button');b.id='nav-gastos';b.innerHTML='＋ Gasto';b.onclick=()=>window.showView('gastos');
      const k=document.getElementById('nav-kpis');k?nav.insertBefore(b,k):nav.appendChild(b);
    }
    if(!document.getElementById('nav-caja')){
      const b=document.createElement('button');b.id='nav-caja';b.innerHTML='▣ Resumen de caja';b.onclick=()=>window.showView('caja');
      const k=document.getElementById('nav-kpis');k?nav.insertBefore(b,k):nav.appendChild(b);
    }
    if(!document.getElementById('nav-operadores')){
      const b=document.createElement('button');b.id='nav-operadores';b.innerHTML='♙ Operadores';b.onclick=()=>window.showView('operadores');
      const backup=document.getElementById('nav-backup');backup?nav.insertBefore(b,backup):nav.appendChild(b);
    }

    // Los tres accesos de control quedan juntos al final: Resumen de caja → Dashboard → KPIs.
    const install=document.getElementById('installPwaBtn');
    ['nav-caja','nav-dashboard','nav-kpis'].forEach(id=>{
      const node=document.getElementById(id);
      if(node)nav.insertBefore(node,install||null);
    });

    const top=document.querySelector('.top > div:last-child');
    if(top&&!document.getElementById('authStatus')){
      const d=document.createElement('div');d.id='authStatus';top.insertBefore(d,top.firstChild);
    }
    updateAuthBar();applyRoleNav();
  }
  function updateAuthBar(){
    const el=document.getElementById('authStatus');if(!el)return;const op=session();
    if(!op){el.innerHTML='<span class="badge">V9.31 corte de caja</span>';return}
    el.innerHTML=`<button class="btn secondary small" type="button" onclick="logoutOperator()">👤 ${e(op.nombre)} · Salir</button>`;
  }
  function applyRoleNav(){
    const op=session(),admin=!!op&&op.rol==='admin';
    ['nav-dashboard','nav-kpis','nav-cleris','nav-backup','nav-operadores'].forEach(id=>{const x=document.getElementById(id);if(x)x.style.display=admin?'':'none'});
    ['nav-nuevo','nav-ordenes','nav-clientes','nav-stock','nav-gastos','nav-caja'].forEach(id=>{const x=document.getElementById(id);if(x)x.style.display=op?'':'none'});
    const t=document.getElementById('nav-turnos');if(t)t.style.display=op?'':'none';
  }
  window.logoutOperator=function(){clearSession();renderLoginOrSetup()};

  function renderLoginOrSetup(){
    ensureNavExtras();document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
    const ops=window.loadOperators();
    if(!ops.length)return renderFirstAdmin();
    const active=ops.filter(x=>x.activo);
    title('Ingreso de operador');
    document.getElementById('view').innerHTML=`<section class="panel" style="max-width:560px;margin:40px auto 0"><div class="panelhead"><div><div class="eyebrow">ACCESO</div><h3>Ingresar a NQN Service</h3></div><span class="badge">V9.31 CORTE DE CAJA</span></div>${active.length?`<form class="grid" style="grid-template-columns:1fr" onsubmit="window.loginOperator(event)"><div class="field"><label>Operador</label><select id="loginOperatorId" required>${active.map(o=>`<option value="${e(o.id)}">${e(o.nombre)}</option>`).join('')}</select></div><div class="field"><label>PIN</label><input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password" required autofocus><div class="hint">Si tu PIN anterior tenía guion, también podés ingresar solo los números.</div></div><div class="actions"><button class="btn primary" type="submit">Ingresar</button></div></form>`:'<div class="alert red"><strong>No hay operadores activos</strong><span>Se necesita un administrador activo para continuar.</span></div>'}</section>`;
    applyRoleNav();
  }
  function renderFirstAdmin(){
    title('Configuración inicial');
    document.getElementById('view').innerHTML=`<section class="panel" style="max-width:620px;margin:40px auto 0"><div class="panelhead"><div><div class="eyebrow">PRIMER INGRESO</div><h3>Crear administrador</h3></div><span class="badge">Se hace una sola vez</span></div><p class="sectionnote">Creá el primer usuario administrador. Después vas a poder agregar, editar, desactivar o eliminar operadores desde la aplicación.</p><form class="grid" style="grid-template-columns:1fr" onsubmit="createFirstAdmin(event)"><div class="field"><label>Nombre *</label><input id="firstAdminName" required autofocus></div><div class="field"><label>PIN *</label><input id="firstAdminPin" type="password" inputmode="numeric" minlength="4" required></div><div class="field"><label>Repetir PIN *</label><input id="firstAdminPin2" type="password" inputmode="numeric" minlength="4" required></div><div class="actions"><button class="btn primary" type="submit">Crear administrador</button></div></form></section>`;
    applyRoleNav();
  }
  window.createFirstAdmin=async function(ev){
    ev.preventDefault();const nombre=document.getElementById('firstAdminName').value.trim(),p1=document.getElementById('firstAdminPin').value,p2=document.getElementById('firstAdminPin2').value;

  window.loginOperator=async function(ev){
    ev.preventDefault();
    try{
      const id=document.getElementById('loginOperatorId').value;
      const input=document.getElementById('loginPin');
      const pin=String(input.value||'').trim();
      const op=window.loadOperators().find(x=>String(x.id)===String(id)&&x.activo);
      if(!op){alert('Operador no disponible.');return}
      const digits=pin.replace(/\D/g,'');
      const candidates=[pin,digits];
      if(digits.length===4)candidates.push(digits.slice(0,2)+'-'+digits.slice(2));
      const unique=[...new Set(candidates.filter(Boolean))];
      let matched=false;
      for(const candidate of unique){
        const currentHash=await hashPin(candidate);
        if(currentHash===op.pinHash||legacyPinHash(candidate)===op.pinHash){matched=true;break}
      }
      if(!matched){alert('PIN incorrecto.');input.select();return}
      if(digits.length>=4){
        const freshHash=await hashPin(digits);
        if(freshHash!==op.pinHash){
          const rows=window.loadOperators();
          const i=rows.findIndex(x=>String(x.id)===String(op.id));
          if(i>=0){rows[i]={...rows[i],pinHash:freshHash,actualizado:now()};window.saveOperators(rows);op.pinHash=freshHash;op.actualizado=rows[i].actualizado;if(typeof queueCloudOp==='function')queueCloudOp('upsertOperator',op.id,op,op.actualizado)}
        }
      }
      setSession(op);afterLogin();
    }catch(err){
      console.error('Error al validar PIN',err);
      alert('No se pudo validar el PIN. Recargá la aplicación e intentá nuevamente.');
    }
  };

  function monthBalance(fecha){
    const mk=String(fecha||localDay()).slice(0,7);
    const orders=(typeof load==='function'?load():[]);
    const ingresos=orders.reduce((a,r)=>{
      const pagos=Array.isArray(r?.pagos)?r.pagos:[];
      if(pagos.length)return a+pagos.filter(p=>String(p.fecha||'').slice(0,7)===mk).reduce((s,p)=>s+Number(p.monto||0),0);
      if(r?.estado==='Entregado'&&String(r.fechaEntrega||'').slice(0,7)===mk)return a+Math.max(0,Number(r.pagado||0));
      return a;
    },0);
    const expenses=(window.loadExpenses?window.loadExpenses():[]).filter(x=>String(x.fecha||'').slice(0,7)===mk);
    const gastos=expenses.reduce((a,x)=>a+Math.max(0,Number(x.monto||0)),0);
    const closings=(window.loadCashClosings?window.loadCashClosings():[]).filter(x=>String(x.fecha||'').slice(0,7)===mk);
    const notas=closings.reduce((a,x)=>a+Math.max(0,Number(x.notaCredito||0)),0);
    return {ingresos,gastos,notas,neto:ingresos-notas-gastos};
  }

  function operationalBalance(fecha){
    const cut=latestCashCut();
    if(!cut)return monthBalance(fecha);

    const cutDate=String(cut.fecha||'');
    const target=String(fecha||localDay());
    if(target<=cutDate)return {ingresos:0,gastos:0,notas:0,neto:0,cut};

    const orders=(typeof load==='function'?load():[]);
    const ingresos=orders.reduce((a,r)=>{
      const pagos=Array.isArray(r?.pagos)?r.pagos:[];
      if(pagos.length){
        return a+pagos.filter(p=>{
          const d=String(p?.fecha||'');
          return d>cutDate&&d<=target;
        }).reduce((s,p)=>s+Math.max(0,Number(p?.monto||0)),0);
      }
      const d=String(r?.fechaEntrega||'');
      if(r?.estado==='Entregado'&&d>cutDate&&d<=target)return a+Math.max(0,Number(r?.pagado||0));
      return a;
    },0);

    const expenses=(window.loadExpenses?window.loadExpenses():[]).filter(x=>{
      const d=String(x?.fecha||'');
      return d>cutDate&&d<=target;
    });
    const gastos=expenses.reduce((a,x)=>a+Math.max(0,Number(x?.monto||0)),0);

    const closings=(window.loadCashClosings?window.loadCashClosings():[]).filter(x=>{
      if(isCashCut(x))return false;
      const d=String(x?.fecha||'');
      return d>cutDate&&d<=target;
    });
    const notas=closings.reduce((a,x)=>a+Math.max(0,Number(x?.notaCredito||0)),0);
    return {ingresos,gastos,notas,neto:ingresos-notas-gastos,cut};
  }

  window.deleteCashSummary=function(id){if(!window.isAdmin()){toast('Solo el administrador puede eliminar cierres');return}const rows=window.loadCashClosings(),x=rows.find(r=>String(r.id)===String(id));if(!x)return;if(isCashCut(x)){alert('El corte de caja no se elimina desde el historial.');return}if(!confirm('¿Eliminar el cierre de '+dateLabel(x.fecha)+' de '+x.operador+'?'))return;window.saveCashClosings(rows.filter(r=>String(r.id)!==String(id)));queueCloudOp('deleteCash',id,null,now());toast('Cierre eliminado');window.showCashSummary()};

  window.renderOperators=function(editId=''){
    rememberCurrentView('operadores');
    if(!window.isAdmin())return window.newOrder();currentView='operadores';editingId=null;setNav('operadores');title('Operadores');
    const rows=window.loadOperators(),r=editId?rows.find(x=>String(x.id)===String(editId)):null;
    document.getElementById('view').innerHTML=`<section class="panel" style="margin-top:0"><div class="panelhead"><div><div class="eyebrow">ACCESOS</div><h3>${r?'Editar operador':'Nuevo operador'}</h3></div><span class="badge">${rows.filter(x=>x.activo).length} activos</span></div><form class="grid" onsubmit="saveOperatorForm(event,'${e(r?.id||'')}')"><div class="field"><label>Nombre *</label><input id="opName" value="${e(r?.nombre||'')}" required></div><div class="field"><label>Rol</label><select id="opRole"><option value="operador" ${r?.rol!=='admin'?'selected':''}>Operador</option><option value="admin" ${r?.rol==='admin'?'selected':''}>Administrador</option></select></div><div class="field"><label>${r?'Nuevo PIN (dejar vacío para conservar)':'PIN *'}</label><input id="opPin" type="password" inputmode="numeric" ${r?'':'required'} minlength="4"></div><div class="field"><label>Estado</label><select id="opActive"><option value="1" ${r?.activo!==false?'selected':''}>Activo</option><option value="0" ${r?.activo===false?'selected':''}>Inactivo</option></select></div><div class="actions full">${r?'<button type="button" class="btn secondary" onclick="renderOperators()">Cancelar</button>':''}<button class="btn primary" type="submit">${r?'Guardar cambios':'Agregar operador'}</button></div></form><p class="sectionnote">Si un operador ya tiene cierres de caja, conviene desactivarlo en lugar de eliminarlo para conservar el historial.</p></section><section class="panel"><div class="panelhead"><div><div class="eyebrow">LISTADO</div><h3>Operadores configurados</h3></div></div>${rows.length?`<div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Rol</th><th>Estado</th><th>Última actualización</th><th></th></tr></thead><tbody>${rows.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')).map(x=>`<tr><td><strong>${e(x.nombre)}</strong></td><td>${x.rol==='admin'?'Administrador':'Operador'}</td><td><span class="badge ${x.activo?'green':'red'}">${x.activo?'Activo':'Inactivo'}</span></td><td>${dtLabel(x.actualizado)}</td><td class="right nowrap"><button class="btn secondary small" onclick="renderOperators('${e(x.id)}')">Editar</button> <button class="btn ${x.activo?'danger':'success'} small" onclick="toggleOperator('${e(x.id)}')">${x.activo?'Desactivar':'Activar'}</button> <button class="btn danger small" onclick="deleteOperator('${e(x.id)}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay operadores.</div>'}</section>`;
  };
  function activeAdmins(rows){return rows.filter(x=>x.activo&&x.rol==='admin')}
  window.saveOperatorForm=async function(ev,id=''){
    ev.preventDefault();let rows=window.loadOperators(),old=id?rows.find(x=>String(x.id)===String(id)):null,name=document.getElementById('opName').value.trim(),role=document.getElementById('opRole').value==='admin'?'admin':'operador',active=document.getElementById('opActive').value==='1',pin=document.getElementById('opPin').value;
    if(!name)return;if(!old&&!pin){alert('Ingresá un PIN.');return}if(pin&&pin.length<4){alert('El PIN debe tener al menos 4 caracteres.');return}
    const current=session();if(old&&current&&String(old.id)===String(current.id)&&!active){alert('No podés desactivar el usuario con el que estás trabajando.');return}
    if(old&&old.rol==='admin'&&(role!=='admin'||!active)&&activeAdmins(rows).length<=1){alert('Tiene que quedar al menos un administrador activo.');return}
    const ts=now(),obj=normalizeOperator({id:id||uid('op'),nombre:name,rol:role,activo:active,pinHash:pin?await hashPin(pin):(old?.pinHash||''),creado:old?.creado||ts,actualizado:ts});
    const dup=rows.find(x=>String(x.id)!==String(obj.id)&&x.nombre.toLowerCase()===name.toLowerCase());if(dup){alert('Ya existe un operador con ese nombre.');return}
    if(old){const i=rows.findIndex(x=>String(x.id)===String(id));rows[i]=obj}else rows.push(obj);window.saveOperators(rows);queueCloudOp('upsertOperator',obj.id,obj,obj.actualizado);if(current&&String(current.id)===String(obj.id))setSession(obj);toast(old?'Operador actualizado':'Operador agregado');window.renderOperators();
  };
  window.toggleOperator=function(id){let rows=window.loadOperators(),x=rows.find(r=>String(r.id)===String(id));if(!x)return;const current=session();if(current&&String(current.id)===String(id)&&x.activo){alert('No podés desactivar el usuario con el que estás trabajando.');return}if(x.rol==='admin'&&x.activo&&activeAdmins(rows).length<=1){alert('Tiene que quedar al menos un administrador activo.');return}x.activo=!x.activo;x.actualizado=now();window.saveOperators(rows);queueCloudOp('upsertOperator',x.id,x,x.actualizado);toast(x.activo?'Operador activado':'Operador desactivado');window.renderOperators()};
  window.deleteOperator=function(id){let rows=window.loadOperators(),x=rows.find(r=>String(r.id)===String(id));if(!x)return;const current=session();if(current&&String(current.id)===String(id)){alert('No podés eliminar el usuario con el que estás trabajando.');return}if(x.rol==='admin'&&x.activo&&activeAdmins(rows).length<=1){alert('Tiene que quedar al menos un administrador activo.');return}const used=window.loadCashClosings().some(c=>String(c.operadorId||'')===String(x.id)||(!c.operadorId&&String(c.operador||'').toLowerCase()===x.nombre.toLowerCase()));if(used){alert('Este operador tiene historial de caja. No se elimina: desactivalo para conservar el registro.');return}if(!confirm('¿Eliminar definitivamente a '+x.nombre+'?'))return;window.saveOperators(rows.filter(r=>String(r.id)!==String(id)));queueCloudOp('deleteOperator',id,null,now());toast('Operador eliminado');window.renderOperators()};

  window.exportData=function(){
    const payload={app:'NQN Service',version:9.28,edicion:'caja-visual-nqn-separado-cleris-gastos-notas',exportado:now(),ordenes:load(),cleriseventos:loadEvents(),cierrescaja:window.loadCashClosings(),gastos:window.loadExpenses(),stock:window.loadStock(),operadores:window.loadOperators(),settings:{lastSave:getSettings().lastSave||null}};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NQN_SERVICE_BACKUP_'+localDay()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);let s=getSettings();s.lastExternalBackup=now();setSettings(s);toast('Copia externa descargada');setTimeout(()=>window.renderBackup(),300)
  };
  window.importData=function(){
    const f=document.getElementById('importFile')?.files?.[0];if(!f){alert('Elegí un archivo de copia primero.');return}const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result),source=Array.isArray(x)?x:x.ordenes;if(!Array.isArray(source))throw new Error();if(!confirm('¿Reemplazar los datos actuales por esta copia?'))return;save(ensureClientNumbers(source.map(normalizeOrder)),'Antes de importar copia');if(Array.isArray(x.cleriseventos))saveEvents(x.cleriseventos);if(Array.isArray(x.cierrescaja))window.saveCashClosings(x.cierrescaja);if(Array.isArray(x.gastos))window.saveExpenses(x.gastos);if(Array.isArray(x.operadores))window.saveOperators(x.operadores);let s=getSettings();s.cloudEverSynced=false;setSettings(s);setCloudQueue([]);clearSession();toast('Copia restaurada');cloudAutoSyncSoon();renderLoginOrSetup()}catch(err){alert('El archivo no parece ser una copia válida de NQN Service.')}};reader.readAsText(f)
  };
  window.runHealthCheck=function(){
    const problems=[];if(!storageSelfTest())problems.push('El navegador no permite almacenamiento local.');const primary=readRowsKey(KEY),mirror=readRowsKey(KEY_MIRROR);if(!validRows(primary))problems.push('La copia principal de órdenes no es válida.');if(!validRows(mirror))problems.push('La copia espejo de órdenes no es válida.');if(validRows(primary)&&validRows(mirror)&&primary.length!==mirror.length)problems.push('Principal y espejo de órdenes tienen distinta cantidad.');if(loadEventsKey(KEY_EVENTS).length!==loadEventsKey(KEY_EVENTS_MIRROR).length)problems.push('Las copias de Cleris no coinciden.');if(readArray(KEY_CASH).length!==readArray(KEY_CASH_MIRROR).length)problems.push('Las copias de caja no coinciden.');if(readArray(KEY_EXPENSES).length!==readArray(KEY_EXPENSES_MIRROR).length)problems.push('Las copias de gastos no coinciden.');if(readArray(KEY_STOCK).length!==readArray(KEY_STOCK_MIRROR).length)problems.push('Las copias de stock no coinciden.');if(readArray(KEY_OPERATORS).length!==readArray(KEY_OPERATORS_MIRROR).length)problems.push('Las copias de operadores no coinciden.');if(!activeAdmins(window.loadOperators()).length)problems.push('No hay administrador activo.');if(problems.length){alert('Revisión del sistema\n\n'+problems.join('\n'));return false}alert('Sistema OK.\n\nÓrdenes: '+load().length+'\nCleris: '+loadEvents().length+'\nCierres de caja: '+window.loadCashClosings().length+'\nGastos locales: '+window.loadExpenses().length+'\nStock local: '+window.loadStock().length+'\nOperadores: '+window.loadOperators().length+'\nAdministrador activo: OK\n\nNota: Gastos y Stock quedan guardados localmente en esta versión. Para sincronizarlos entre teléfono y PC también hay que revisar/actualizar Code.gs.');return true
  };

  window.secureBoot=async function(){
    ensureNavExtras();if(!storageSelfTest()){document.getElementById('view').innerHTML='<section class="panel"><h3>No se puede iniciar el almacenamiento local</h3><p>Esta versión necesita Microsoft Edge o Google Chrome.</p></section>';return}
    migrateIfNeeded();try{saveEvents(loadEvents())}catch(e){}migrateCashIfNeeded();try{window.saveCashClosings(window.loadCashClosings())}catch(e){}try{window.saveOperators(window.loadOperators())}catch(e){}updateNetworkStatus();
    if(cloudConfigured()&&navigator.onLine){try{await cloudSync(true)}catch(e){}}
    if(session())afterLogin();else renderLoginOrSetup();
  };

  ensureNavExtras();
  window.secureBoot();
})();

  </script>
